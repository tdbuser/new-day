<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06241a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEW DAY">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%98%80%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>NEW DAY — Yangi kun — Новый день</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--em1:#0f4a36;--em2:#06241a;--em3:#030d09;--gold:#ffd23f;--gold2:#e0951a;--mint:#2ee88f;--green:#15803d;--red:#b91c1c;--card:rgba(6,36,26,.85);--line:rgba(46,232,143,.32);--mut:#9fc7b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,var(--em1) 0%,var(--em2) 55%,var(--em3) 100%) fixed;color:#fff;font-family:Nunito,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35}
#app{max-width:560px;margin:0 auto;padding:12px 14px 80px}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 10px}
h1{font-size:28px;font-weight:900;color:var(--gold)}
h2{font-size:21px;font-weight:900;color:var(--gold)}
h3{font-size:17px;font-weight:800}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 0 30px rgba(46,232,143,.07)}
.center{text-align:center}
.hide{display:none!important}

/* шапка */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;background:linear-gradient(#06241af2,#06241ad0 80%,transparent)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.whot{min-width:0}.nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.lv{font-size:13px;color:var(--gold);font-weight:800}
.avatar{width:42px;height:42px;border-radius:50%;background:#12614a;border:2px solid var(--gold);object-fit:cover;display:grid;place-items:center;font-weight:900;flex:none}
.coinpill{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;border:2px solid var(--gold);background:rgba(0,0,0,.35);box-shadow:0 0 18px rgba(255,210,63,.35);flex:none}
.coinpill b{font-size:23px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.coinpill b.neg{color:#ff8a80}
.coin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;color:#8a5200;background:radial-gradient(circle at 35% 30%,#fff2a8,#ffd23f 60%,var(--gold2));border:2px solid #b86f0a;box-shadow:inset 0 0 0 3px rgba(184,111,10,.25);flex:none}
.coin.sm{width:20px;height:20px;font-size:12px;border-width:1.5px}
.lvbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin:2px 0 8px}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:6px;transition:width .6s}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
.chipbtn,.bar select{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;font-size:15px}
.bar select{appearance:auto;color:#fff}.bar select option{color:#000}
.chipbtn.on{border-color:var(--gold);color:var(--gold)}

/* большие кнопки */
.big{display:block;width:100%;min-height:68px;border:0;border-radius:20px;color:#fff;font-weight:900;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;margin-top:10px;padding:0 14px;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.big.green{background:var(--green)}.big.red{background:var(--red)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn.gold{background:var(--gold);color:#2a1b00;border-color:var(--gold)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.sm{padding:7px 10px;font-size:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:60px;background:#fff;color:#222;border:0;border-radius:18px;font-weight:900;font-size:20px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.gbtn svg{width:26px;height:26px}

/* задания */
.nowcard{border-color:var(--gold);box-shadow:0 0 34px rgba(255,210,63,.18)}
.nowtag{display:inline-block;background:var(--gold);color:#2a1b00;border-radius:999px;padding:2px 12px;font-weight:900;font-size:13px;margin-bottom:6px}
.task{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin:10px 0}
.task.st-active{border-color:var(--gold);background:rgba(255,210,63,.08)}
.task.st-done{border-color:#2ee88f;background:rgba(46,232,143,.1)}
.task.st-missed,.task.st-failed,.task.st-expired{border-color:#ff5a5a;background:rgba(185,28,28,.14)}
.task.st-locked,.task.st-future{opacity:.62}
.trow{display:flex;align-items:center;gap:12px}
.ticon{font-size:30px;flex:none}
.ttime{font-weight:900;color:var(--gold);font-size:15px}
.ttitle{font-weight:800;font-size:19px}
.tbadge{margin-left:auto;font-weight:900;white-space:nowrap;font-size:16px}
.tbadge.ok{color:var(--mint)}.tbadge.bad{color:#ff8a80}
.pbar{height:12px;border-radius:12px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:12px;transition:width .6s}

/* календарь месяца */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.07)}
.cal .d.g{background:#15803d}.cal .d.y{background:#a16207}.cal .d.r{background:#b91c1c}.cal .d.t{outline:2px solid var(--gold)}
.cal .h{font-size:11px;color:var(--mut);text-align:center}
.prize{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:rgba(255,210,63,.12);border:1px solid var(--gold);margin:8px 0}
.prize .pi{font-size:34px}

/* админка */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs .chipbtn{white-space:nowrap}
.badge{background:#e11d48;border-radius:999px;padding:0 7px;margin-left:5px;font-size:12px;font-weight:900}
.u .urow{display:flex;align-items:center;gap:10px}
.chip{margin-left:auto;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900}
.chip.pending{background:#a16207}.chip.approved{background:var(--green)}.chip.blocked{background:var(--red)}
.u.pending{border-color:var(--gold)}
label.f{display:block;margin:8px 0;font-size:14px;color:var(--mut)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;font-size:16px}
label.f select option{color:#000}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:800}
.chk input{width:22px;height:22px;accent-color:var(--mint)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.tk{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.04)}
details.tk summary{cursor:pointer;font-weight:800}
.relgrid{display:flex;flex-wrap:wrap;gap:6px 14px}

/* всплывающие окна и эффекты */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.modal>div{width:min(94vw,480px);max-height:88vh;overflow:auto;background:#06241a;border:1px solid var(--gold);border-radius:22px;padding:18px}
#ovl{position:fixed;inset:0;z-index:80;pointer-events:none;display:grid;place-items:center}
.banner{pointer-events:auto;width:min(92vw,440px);border-radius:24px;padding:20px;text-align:center;font-weight:900;font-size:22px;animation:pop .35s}
.banner.warn{background:#b91c1c;border:3px solid #fff;box-shadow:0 0 60px #ff1f1f}
.banner.burn{background:#450a0a;border:3px solid #ff5a5a;box-shadow:0 0 80px #ff0000}
.banner.good{background:linear-gradient(#ffd23f,#e0951a);color:#2a1b00;border:3px solid #fff2a8}
.banner small{display:block;font-weight:700;font-size:15px;margin-top:6px}
.redflash{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle,transparent 30%,rgba(255,0,0,.55));animation:flash .9s 3}
.flycoin{position:fixed;z-index:90;pointer-events:none;width:30px;height:30px}
body.shake #app{animation:shake .5s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flash{0%,100%{opacity:0}50%{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.demo{background:#a16207;color:#fff;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:800;text-align:center;margin-bottom:8px}
/* ---- добавлено: нижние вкладки, фото, камера, ранги, звуки ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(6,36,26,.96);border-top:2px solid #e0b43a;z-index:40}
.tabbar button{flex:1;background:transparent;border:0;color:#cfe9dc;font:800 14px Nunito,system-ui,sans-serif;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:20px}
.tabbar button.on{background:#e0b43a;color:#2a1b00}
#app{padding-bottom:92px}
.big.gold{background:linear-gradient(180deg,#ffd23f,#e0951a);color:#2a1b00}
.big.gold{margin-top:8px}
.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.rankbig{font-size:22px;font-weight:900;color:var(--gold);margin-top:6px}
.stat{background:rgba(255,255,255,.06);border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:20px}
.hrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.hrow span:nth-child(2){flex:1}
.hrow b.neg{color:#ff8a80}
#modal video{width:100%;border-radius:12px;background:#000;max-height:60vh}

.fbar{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:8px;margin-top:6px}
.fbar span{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar b{text-align:right;font-size:15px}
.fbar .pbar{margin:0}
.fsub{margin:2px 0 0 80px;font-size:12px}
.fam.lead{border-color:#e0b43a;box-shadow:0 0 0 2px rgba(224,180,58,.45),0 0 24px rgba(224,180,58,.25)}
.fam.me{background:rgba(224,180,58,.06)}
.pbar.mine i{background:linear-gradient(90deg,#e0b43a,#ffd86b)}
.cmp{margin-top:10px}
.tabbar button{font-size:13px}

.evcard .evrow,.evrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.evrow.big{margin-top:0}
.evi{font-size:28px;flex:none}
.evwhen{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap;font-size:14px}
.evtoday{color:var(--mint)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti span{position:absolute;top:-40px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(540deg)}}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.vtile{position:relative;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;color:#fff;text-align:left;font:inherit}
.vtile img,.plthumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0b2e22}
.plthumb{display:grid;place-items:center;font-size:36px}
.vplay{position:absolute;top:calc(28% - 18px);left:calc(50% - 22px);width:44px;height:36px;border-radius:10px;background:rgba(220,0,0,.9);display:grid;place-items:center;font-size:16px}
.vt{display:block;padding:6px 8px 8px;font-weight:800;font-size:13px;line-height:1.25}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin:8px 0}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.kgames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.kgame{background:linear-gradient(160deg,#1f7a58,#0e3d2c);border:2px solid var(--gold);border-radius:18px;color:#fff;font:900 15px Nunito,system-ui,sans-serif;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.kgame span{font-size:40px}
.modal.game>div{width:min(560px,100%);height:min(92vh,760px);display:flex;flex-direction:column}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ghead b{font-size:18px;color:var(--gold)}
.ghead span{margin-left:auto;font-weight:900;font-size:18px}
.garea{position:relative;flex:1;border-radius:16px;overflow:hidden;background:linear-gradient(#7cc7ff,#d9f1ff)}
.balloon{position:absolute;bottom:-70px;font-size:52px;background:none;border:0;padding:0;animation:rise linear forwards;touch-action:manipulation}
.balloon.pop{animation-play-state:paused;transform:scale(1.4)}
@keyframes rise{to{bottom:110%}}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcard{border-radius:16px;border:2px solid var(--gold);background:linear-gradient(160deg,#ffd23f,#e0951a);font-size:44px;min-height:80px;touch-action:manipulation}
.mcard span{visibility:hidden}
.mcard.up{background:#fff}
.mcard.up span{visibility:visible}
.mcard.ok{background:#c9f7de;border-color:var(--mint)}
.abig{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;border-radius:16px;background:rgba(255,255,255,.08);margin-bottom:10px}
.abig span{font-size:90px;line-height:1}
.abig b{font-size:26px;color:var(--gold)}
.abig i{font-style:normal;font-size:20px}
.abig.bounce{animation:bounce .5s}
@keyframes bounce{40%{transform:scale(1.15)}}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acard{font-size:48px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.08);padding:10px 0;touch-action:manipulation}
.tabbar button{font-size:12px;padding:6px 0}

/* ===== игровой «премиум» вид: стекло, золото, свечение ===== */
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
body{background:
  radial-gradient(1200px 600px at 50% -10%,rgba(46,232,143,.18),transparent 60%),
  radial-gradient(800px 500px at 110% 30%,rgba(255,210,63,.10),transparent 60%),
  radial-gradient(ellipse at top,#0f4a36 0%,#06241a 55%,#030d09 100%) fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1.4px 1.4px at 12% 18%,#ffd23f,transparent),radial-gradient(1px 1px at 72% 12%,#fff2a8,transparent),
  radial-gradient(1.2px 1.2px at 38% 62%,#ffd23f,transparent),radial-gradient(1px 1px at 88% 74%,#fff2a8,transparent),
  radial-gradient(1.3px 1.3px at 22% 86%,#2ee88f,transparent),radial-gradient(1px 1px at 58% 36%,#fff,transparent),
  radial-gradient(1.2px 1.2px at 92% 44%,#ffd23f,transparent),radial-gradient(1px 1px at 6% 52%,#fff2a8,transparent);
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.7}}
#app{position:relative;z-index:1}
h1,h2{background:linear-gradient(180deg,#fff6c2,#ffd23f 55%,#e0951a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 8px rgba(255,210,63,.25))}
.card{background:linear-gradient(160deg,rgba(24,104,74,.42),rgba(5,28,20,.88) 55%);border:1px solid rgba(46,232,143,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 12px 32px rgba(0,0,0,.38),0 0 0 1px rgba(0,0,0,.2);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top{background:linear-gradient(#06241af5,#06241acc 80%,transparent)}
.avatar{box-shadow:0 0 0 3px rgba(255,210,63,.25),0 0 18px rgba(255,210,63,.35)}
/* баланс: стопка монет, вращающаяся золотая рамка, блик */
.coinpill{position:relative;overflow:hidden;padding:5px 16px 5px 6px;border:2px solid transparent;
  background:linear-gradient(180deg,#0b2f22,#041710) padding-box,conic-gradient(from var(--spin),#ffd23f,#2ee88f,#fff2a8,#e0951a,#ffd23f) border-box;
  animation:spin 6s linear infinite;box-shadow:0 0 22px rgba(255,210,63,.45),inset 0 0 14px rgba(255,210,63,.15)}
@keyframes spin{to{--spin:360deg}}
.coinpill::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.cstack{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 6px rgba(255,180,0,.55));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-2px)}}
.coinpill b{font-size:25px;text-shadow:0 0 12px rgba(255,210,63,.6)}
.coinpill.bump{animation:spin 6s linear infinite,bump .7s}
.coinpill.drop{animation:spin 6s linear infinite,drop .7s}
@keyframes bump{30%{transform:scale(1.14);box-shadow:0 0 40px rgba(255,210,63,.95)}}
@keyframes drop{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.spark{position:fixed;z-index:95;pointer-events:none;color:#ffd23f;font-size:16px;text-shadow:0 0 8px #ffd23f}
.lvbar{height:7px;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.pbar i,.lvbar i{background:linear-gradient(90deg,#2ee88f,#ffd23f),repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px);background-blend-mode:overlay;background-size:100% 100%,32px 32px;animation:stripes 1.2s linear infinite;box-shadow:0 0 12px rgba(46,232,143,.5)}
@keyframes stripes{to{background-position:0 0,32px 0}}
/* кнопки: объём, блеск, свечение */
.big{position:relative;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.28),0 10px 26px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.big.green{background:linear-gradient(180deg,#34d975,#14803c);box-shadow:0 6px 0 #0b4f25,inset 0 2px 0 rgba(255,255,255,.3),0 0 26px rgba(46,232,143,.35)}
.big.red{background:linear-gradient(180deg,#f05252,#991b1b);box-shadow:0 6px 0 #5c0f0f,inset 0 2px 0 rgba(255,255,255,.25),0 0 22px rgba(255,60,60,.25)}
.big.gold{background:linear-gradient(180deg,#fff2a8,#ffd23f 40%,#e0951a);color:#2a1b00;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 6px 0 #8a5200,inset 0 2px 0 rgba(255,255,255,.5),0 0 26px rgba(255,210,63,.4)}
.btn.gold{background:linear-gradient(180deg,#fff2a8,#ffd23f 45%,#e0951a);box-shadow:0 3px 0 #8a5200,0 0 14px rgba(255,210,63,.35)}

/* ===== logic.js: время, монеты, штрафы, бонусы, ранги, фото, выплаты (без интерфейса) ===== */
const Logic = (() => {
  const pad = n => String(n).padStart(2, '0');

  // Текущие дата и минуты в нужном часовом поясе
  function tzNow(tz, ms) {
    const o = {};
    new Intl.DateTimeFormat('en-CA', {
      timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date(ms)).forEach(p => { o[p.type] = p.value; });
    return { date: `${o.year}-${o.month}-${o.day}`, min: (+o.hour) * 60 + (+o.minute), ms };
  }
  const toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
  const fmtMin = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  function addDays(date, n) {
    const [y, m, d] = date.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  }
  const weekday = date => { const [y, m, d] = date.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
  const weekStart = date => addDays(date, -((weekday(date) + 6) % 7)); // понедельник
  const monthOf = date => date.slice(0, 7);
  const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
  const lastDayOf = ym => `${ym}-${pad(daysInMonth(ym))}`;
  const prevMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 7); };
  const maxStr = (...a) => a.reduce((x, y) => (x > y ? x : y), '');

  const PHOTO_TTL_MS = 48 * 3600 * 1000;   // фото хранятся двое суток
  const RATE_COINS = 5000;                  // монет в месяц, на которые делится бюджет в USD

  const DEFAULTS = {
    missPenaltyPct: 50,    // штраф за пропуск, % от награды задания
    warnings: 2,           // сколько пропусков за день только предупреждают
    burnPct: 70,           // на следующем пропуске сгорает % дневного лимита
    weeklyGoalPct: 80,     // % выполнения за неделю для подарка
    idealPct: 90,          // % выполнения для «идеальной» недели и месяца
    streakStepPct: 2,      // бонус серии: +2% за каждый идеальный день подряд
    streakMaxPct: 30,      // но не больше +30%
    idealWeekBonus: 10000, // +100 монет за идеальную неделю (в сотых)
    idealMonthBonus: 50000,// +500 монет за идеальный месяц
    budgetUsd: 0,          // месячный бюджет на выплаты, USD (задаёт админ)
    rateCoins: RATE_COINS,
    usdPerCoin: 0,         // считается из бюджета; 0 = курс не задан
    backfillDays: 7,       // сколько дней назад дописывать пропуски
    tz: 'Asia/Tashkent',
    sounds: {},
    prizes: [
      { icon: '🍢', uz: "Restoranda shashlik bilan kechki ovqat", ru: 'Ужин с шашлыками в ресторане', en: 'Barbecue dinner at a restaurant' },
      { icon: '🐟', uz: "Baliq restoranida kechki ovqat", ru: 'Ужин в рыбном ресторане', en: 'Dinner at a fish restaurant' },
      { icon: '🍽️', uz: "Restoranda tushlik", ru: 'Обед в ресторане', en: 'Lunch at a restaurant' },
      { icon: '🍰', uz: "Kafeda shirinlik va qahva", ru: 'Десерты и кофе в кафе', en: 'Desserts and coffee at a café' },
      { icon: '🎬', uz: "Oilaviy kino", ru: 'Семейный поход в кино', en: 'Family movie night' },
      { icon: '🛍️', uz: "Sovg'a tanlash uchun xarid", ru: 'Шопинг: выбрать себе подарок', en: 'Shopping trip to pick a gift' }
    ]
  };
  // Курс считается из бюджета: бюджет ÷ 5000 монет
  const cfg = s => {
    const c = Object.assign({}, DEFAULTS, s || {});
    if (c.budgetUsd > 0) c.usdPerCoin = c.budgetUsd / (c.rateCoins || RATE_COINS);
    return c;
  };

  // Ранги по заработанным монетам (порог в монетах)
  const RANKS = [
    [0, { uz: 'Yangi boshlovchi', ru: 'Новичок', en: 'Beginner' }],
    [500, { uz: 'Olov', ru: 'Огонёк', en: 'Spark' }],
    [1500, { uz: "Oila tayanchi", ru: 'Опора дома', en: 'Home pillar' }],
    [3500, { uz: 'Kun ustasi', ru: 'Мастер дня', en: 'Day master' }],
    [7000, { uz: 'Oila yulduzi', ru: 'Звезда семьи', en: 'Family star' }],
    [12000, { uz: "O'choq qo'riqchisi", ru: 'Хранитель очага', en: 'Hearth keeper' }],
    [20000, { uz: 'Afsona', ru: 'Легенда', en: 'Legend' }]
  ];

  const T0 = (id, time, icon, uz, ru, en, grace) => ({
    id, time, icon, title: { uz, ru, en }, reward: 1000, graceMin: grace, earlyMin: 15,
    relations: ['wife'], uids: [], active: true, since: '', photo: 'opt'
  });
  const DEFAULT_TASKS = [
    T0('wake', '06:00', '⏰', "Uyg'onish", 'Подъём', 'Wake up', 30),
    T0('teeth_am', '07:30', '🪥', "Dilnozaning tishlarini tozalash", 'Почистить зубки Дильнозе', "Brush Dilnoza's teeth", 60),
    T0('breakfast', '08:00', '🍳', 'Nonushta tayyor', 'Завтрак готов', 'Breakfast is ready', 60),
    T0('lunch', '12:00', '🍲', 'Tushlik tayyor', 'Обед готов', 'Lunch is ready', 60),
    T0('nap', '13:00', '😴', "Kunduzgi uyqu (13:00–14:00)", 'Дневной сон (13:00–14:00)', 'Nap time (1–2 pm)', 30),
    T0('snack', '16:00', '🍪', 'Yengil tamaddi tayyor', 'Полдник готов', 'Afternoon snack is ready', 60),
    T0('dinner', '18:00', '🍽️', 'Kechki ovqat tayyor', 'Ужин готов', 'Dinner is ready', 60),
    T0('teeth_pm', '21:00', '🪥', "Dilnozaning tishlarini tozalash (kechqurun)", 'Почистить зубки Дильнозе (вечером)', "Brush Dilnoza's teeth (evening)", 60),
    T0('medicine', '21:00', '💊', "Dilnozaga dori (kalsiy) berish", 'Дать Дильнозе препарат (кальций)', 'Give Dilnoza her medicine (calcium)', 60),
    T0('sleep', '22:00', '🌙', 'Uxlash vaqti', 'Отбой', 'Bedtime', 30)
  ];

  // Кому назначено задание в этот день
  function assigned(t, u, date) {
    if (!t || t.active === false) return false;
    const r = t.relations || [];
    const ok = r.includes('*') || (u.relation && r.includes(u.relation)) || (t.uids || []).includes(u.uid);
    if (!ok) return false;
    if (!date) return true;
    if (date < maxStr(t.since || '', u.approvedDate || '')) return false;
    // расписание: разовое (once = дата) или по дням недели (days = [0..6], 0 = воскресенье)
    if (t.once) return date === t.once;
    if (Array.isArray(t.days) && t.days.length && t.days.length < 7) return t.days.includes(weekday(date));
    return true;
  }
  const sortTasks = ts => ts.slice().sort((a, b) => toMin(a.time) - toMin(b.time) || String(a.id).localeCompare(String(b.id)));
  const logIndex = logs => new Map(logs.map(l => [l.id, l]));
  const logId = (uid, date, taskId) => `${uid}_${date}_${taskId}`;
  const isMiss = l => l && (l.kind === 'missed' || l.kind === 'failed');

  // Состояние задания: locked / active / expired / future или вид записи (done/missed/failed)
  function taskState(t, date, now, log) {
    if (log) return log.kind;
    if (date > now.date) return 'future';
    if (date < now.date) return 'expired';
    const base = toMin(t.time);
    const from = base - (t.earlyMin ?? 15), deadline = base + (t.graceMin ?? 60);
    if (now.min < from) return 'locked';
    if (now.min <= deadline) return 'active';
    return 'expired';
  }

  const photoMode = t => (t && ['off', 'opt', 'req'].includes(t.photo) ? t.photo : 'opt');
  const dayLimit = ts => ts.reduce((s, t) => s + (t.reward || 0), 0);

  // Запись о пропуске: штраф + (при N-м пропуске за день) сгорание части дневного лимита
  function makeMiss(u, t, date, kind, strike, limit, c) {
    const penalty = Math.ceil((t.reward || 0) * c.missPenaltyPct / 100);
    const burn = strike === c.warnings + 1 ? Math.ceil(limit * c.burnPct / 100) : 0;
    return {
      id: logId(u.uid, date, t.id), uid: u.uid, date, taskId: t.id, kind, strike,

  const missesOn = (logs, date) => logs.filter(l => l.date === date && isMiss(l)).length;

  // Какие пропуски надо дописать (задание просрочено, записи нет)
  function pendingMisses(tasks, logs, u, now, settings) {
    const c = cfg(settings);
    const idx = logIndex(logs);
    const start = maxStr(addDays(now.date, -c.backfillDays), u.approvedDate || '');
    const out = [];
    for (let d = start; d <= now.date && d; d = addDays(d, 1)) {
      const dayTasks = sortTasks(tasks.filter(t => assigned(t, u, d)));
      const limit = dayLimit(dayTasks);
      let count = missesOn(logs, d);
      for (const t of dayTasks) {
        if (idx.has(logId(u.uid, d, t.id))) continue;
        if (taskState(t, d, now, null) !== 'expired') continue;
        count += 1;
        out.push(makeMiss(u, t, d, 'missed', count, limit, c));

    }

  }
  // Пропуск, нажатый вручную красной кнопкой

  }
  // Выполнено. Если задание с фото — запись получает фото и ждёт проверки админом.
  const doneLog = (u, t, now, photo) => {
    const l = { id: logId(u.uid, now.date, t.id), uid: u.uid, date: now.date, taskId: t.id, kind: 'done', delta: t.reward || 0, hasPhoto: !!photo };
    if (photo) { l.photo = photo; l.review = 'pending'; }

  const photoExpired = (l, nowMs) => !!(l && l.hasPhoto && l.at && nowMs - l.at > PHOTO_TTL_MS);

  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const balance = logs => sum(logs, l => l.delta || 0);
  const earned = logs => sum(logs.filter(l => l.kind === 'done' || l.kind === 'bonus'), l => l.delta || 0);

  // Ранг по заработку: уровень, название, прогресс до следующего ранга
  function level(earnedCents) {
    const c = earnedCents / 100;
    let i = 0;
    while (i + 1 < RANKS.length && c >= RANKS[i + 1][0]) i++;
    const nxt = RANKS[i + 1] ? RANKS[i + 1][0] : null, cur = RANKS[i][0];
    const pct = nxt === null ? 1 : Math.max(0, Math.min(1, (c - cur) / (nxt - cur)));

  function dayStats(tasks, logs, u, date, now) {

    ts.forEach(t => {

  // Бонусы: серия идеальных дней, идеальная неделя, идеальный месяц

  const daysBetween = (a, b) => { const p = x => { const [y, m, d] = x.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 86400000); };

      tone(1046.5, t + 0.6, 0.9, 'sine', 0.14);
    },

    cash() {

      tone(1568, t, 0.12, 'square', 0.09); tone(2093, t + 0.07, 0.5, 'square', 0.09); tone(3136, t + 0.07, 0.45, 'sine', 0.06);
      noise(t + 0.02, 0.18, 0.06);
      for (let i = 0; i < 16; i++) {
        const tt = t + 0.22 + i * 0.06 + Math.random() * 0.02, f = 2200 + Math.random() * 1800;
        tone(f, tt, 0.12, 'triangle', 0.055); tone(f * 1.5, tt + 0.01, 0.08, 'sine', 0.025);
      }
      tone(1046.5, t + 1.25, 0.6, 'triangle', 0.08); tone(1568, t + 1.3, 0.7, 'sine', 0.06);
    },
    // Напоминание о задании: мягкий «динь-дон»
    ding() {
      if (!ensure()) return; const t = ctx.currentTime;
      tone(1318.5, t, 0.9, 'sine', 0.2); tone(987.8, t + 0.35, 1.1, 'sine', 0.2); tone(2637, t, 0.4, 'sine', 0.03);
    },
    tick() { if (ensure()) tone(1200, ctx.currentTime, 0.05, 'sine', 0.05); },
    off() {}
  };
  const PRESET_NAMES = ['cash', 'coin', 'ding', 'bell', 'wrong', 'warn', 'burn', 'fanfare', 'off'];

  // Звук события: если админ задал свою ссылку — играет файл, иначе пресет
  function play(event, sc) {
    const s = sc || {};
    if (s.u) {
      try { if (fileAudio) fileAudio.pause(); fileAudio = new Audio(s.u); fileAudio.play().catch(() => {}); return; } catch (e) { /* пресет ниже */ }
    }
    (presets[s.p] || presets[event] || presets.coin)();
  }
  const coin = () => presets.coin(), wrong = () => presets.wrong(), warn = () => presets.warn(),
    burn = () => presets.burn(), fanfare = () => presets.fanfare(), tick = () => presets.tick();

  // Фоновая музыка: встроенный перебор аккордов или своя ссылка (зацикливается)
  function schedule() {
    while (nextT < ctx.currentTime + 0.5) {
      const bar = Math.floor(step / 8) % chords.length, ch = chords[bar], i = step % 8;
      const f = ch[[0, 1, 2, 1, 0, 1, 2, 1][i]] * (i >= 6 ? 2 : 1);
      tone(f, nextT, 1.1, 'sine', 0.05, musicGain);
      if (i === 0) tone(ch[0] / 2, nextT, 2.4, 'triangle', 0.06, musicGain);
      step++; nextT += 0.42;
    }
  }
  function startMusic() {
    musicOn = true;
    if (musicPreset === 'off') return;
    if (musicUrl) {
      if (!musicAudio) {
        musicAudio = new Audio(musicUrl); musicAudio.loop = true; musicAudio.volume = 0.5;
        // ссылка не работает — играет стандартная музыка
        musicAudio.onerror = () => { musicUrl = ''; musicAudio = null; if (musicOn) { musicOn = false; startMusic(); } };
      }
      musicAudio.play().catch(() => {});
      return;
    }
    if (!ensure() || timer) return;
    nextT = ctx.currentTime + 0.1; schedule(); timer = setInterval(schedule, 200);
  }
  function stopMusic() {
    musicOn = false;
    if (timer) { clearInterval(timer); timer = null; }
    if (musicAudio) musicAudio.pause();
  }
  function setMusic(sc) {
    const s = sc || {};
    const wasOn = musicOn;
    stopMusic();
    musicPreset = s.p || 'chords';
    musicUrl = s.u || '';
    musicAudio = null;
    if (wasOn) startMusic();
  }
  function unlock() { if (ensure() && musicOn && !timer && !musicAudio) startMusic(); }

  return { coin, wrong, warn, burn, fanfare, tick, play, PRESET_NAMES, startMusic, stopMusic, setMusic, unlock, get on() { return musicOn; } };
})();


/* ===== store_demo.js: демо-хранилище в localStorage (без интернета и Firebase) ===== */
const DemoStore = (() => {
  const KEY = 'fp_demo_v1', AUTH = 'fp_demo_auth';
  const fresh = () => ({ users: {}, whitelist: {}, tasks: {}, settings: {}, logs: {}, payouts: {}, scores: {}, claims: {}, recipes: {}, shared: {} });
  let st = fresh(), subs = new Set(), authCb = null;
  const load = () => { try { st = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { st = fresh(); } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* переполнено: данные останутся в памяти */ } subs.forEach(f => f()); };
  const watch = fn => { subs.add(fn); fn(); return () => subs.delete(fn); };
  const uidOf = e => 'u_' + e.toLowerCase().replace(/[^a-z0-9]/g, '_');
  const clone = o => JSON.parse(JSON.stringify(o));
  const list = o => Object.values(o).map(clone);

  async function init() { load(); window.addEventListener('storage', () => { load(); subs.forEach(f => f()); }); }
  function curAuth() { try { return JSON.parse(localStorage.getItem(AUTH)); } catch (e) { return null; } }
  function onAuth(cb) { authCb = cb; cb(curAuth()); }
  async function signIn(o) {
    const email = String(o.email || '').trim().toLowerCase();
    if (!email.includes('@')) throw new Error('email');
    localStorage.setItem(AUTH, JSON.stringify({ uid: uidOf(email), email, name: o.name || email.split('@')[0], photo: '' }));
    authCb && authCb(curAuth());
  }
  async function signOut() { localStorage.removeItem(AUTH); authCb && authCb(null); }

  const getUser = async uid => (st.users[uid] ? clone(st.users[uid]) : null);
  const watchUser = (uid, cb) => watch(() => cb(st.users[uid] ? clone(st.users[uid]) : null));
  const createUser = async (uid, d) => { st.users[uid] = clone(d); save(); };
  const updateUser = async (uid, p) => { if (st.users[uid]) Object.assign(st.users[uid], clone(p)); save(); };
  const deleteUser = async uid => { delete st.users[uid]; save(); };
  const watchUsers = cb => watch(() => cb(list(st.users)));

  const getWhitelist = async em => (st.whitelist[em] ? clone(st.whitelist[em]) : null);
  const watchWhitelist = cb => watch(() => cb(Object.entries(st.whitelist).map(([email, v]) => Object.assign({ email }, clone(v)))));
  const addWhitelist = async (em, d) => { st.whitelist[em] = clone(d); save(); };
  const delWhitelist = async em => { delete st.whitelist[em]; save(); };

  const watchTasks = cb => watch(() => cb(list(st.tasks)));
  const saveTask = async t => { st.tasks[t.id] = clone(t); save(); };
  const delTask = async id => { delete st.tasks[id]; save(); };
  const watchSettings = cb => watch(() => cb(clone(st.settings.main || {})));
  const saveSettings = async o => { st.settings.main = clone(o); save(); };

  const watchLogs = (uid, cb) => watch(() => cb(list(st.logs).filter(l => l.uid === uid)));
  const addLog = async l => {
    if (st.logs[l.id] && !String(l.id).startsWith('adj_')) throw new Error('exists');
    st.logs[l.id] = Object.assign(clone(l), { at: Date.now() }); save();
  };
  const delLog = async id => { delete st.logs[id]; save(); };
  const watchPhotos = cb => watch(() => cb(list(st.logs).filter(l => l.hasPhoto)));
  const decidePhoto = async (id, patch) => {
    if (st.logs[id]) { Object.assign(st.logs[id], clone(patch)); st.logs[id].hasPhoto = false; delete st.logs[id].photo; }
    save();
  };
  const updateLog = async (id, patch) => { if (st.logs[id]) Object.assign(st.logs[id], clone(patch)); save(); };

  const watchScores = cb => watch(() => cb(list(st.scores)));
  const saveScore = async (uid, d) => { st.scores[uid] = Object.assign(clone(d), { uid, updatedAt: Date.now() }); save(); };

  const watchClaims = cb => watch(() => cb(list(st.claims)));
  const watchMyClaims = (uid, cb) => watch(() => cb(list(st.claims).filter(c => c.uid === uid)));
  const addClaim = async c => { st.claims[c.id] = clone(c); save(); };
  const updateClaim = async (id, p) => { if (st.claims[id]) Object.assign(st.claims[id], clone(p)); save(); };
  const watchRecipes = cb => watch(() => cb(list(st.recipes)));
  const saveRecipe = async r => { st.recipes[r.id] = clone(r); save(); };
  const delRecipe = async id => { delete st.recipes[id]; save(); };
  const watchShared = (id, cb) => watch(() => cb(clone(st.shared[id] || {})));
  const saveShared = async (id, o) => { st.shared[id] = Object.assign(st.shared[id] || {}, clone(o)); save(); };
  const dumpCol = async n => Object.entries(st[n] || {}).map(([k, v]) => Object.assign({ _id: k }, clone(v)));
  const restoreDoc = async (n, id, d) => { st[n] = st[n] || {}; st[n][id] = clone(d); save(); };

  const watchPayouts = cb => watch(() => cb(list(st.payouts)));
  const watchMyPayouts = (uid, cb) => watch(() => cb(list(st.payouts).filter(p => p.uid === uid)));
  const addPayout = async p => { st.payouts[p.id] = clone(p); save(); };
  const updatePayout = async (id, p) => { if (st.payouts[id]) Object.assign(st.payouts[id], clone(p)); save(); };

  return { demo: true, init, onAuth, signIn, signOut, getUser, watchUser, createUser, updateUser, deleteUser, watchUsers,
    getWhitelist, watchWhitelist, addWhitelist, delWhitelist, watchTasks, saveTask, delTask, watchSettings, saveSettings,
    watchLogs, addLog, delLog, watchPhotos, decidePhoto, updateLog, watchPayouts, watchMyPayouts, addPayout, updatePayout, watchScores, saveScore,
    watchClaims, watchMyClaims, addClaim, updateClaim, watchRecipes, saveRecipe, delRecipe, watchShared, saveShared, dumpCol, restoreDoc };
})();


/* ===== store_firebase.js: реальное хранилище (Firebase Auth + Firestore) ===== */
const FirebaseStore = (() => {
  let A, F, auth, db, onErr = () => {};
  const col = n => F.collection(db, n);
  const ref = (n, id) => F.doc(db, n, id);
  const ms = v => (v && v.toMillis ? v.toMillis() : v);
  const errCb = e => { console.error(e); onErr(e); };
  const listen = (q, map, cb) => F.onSnapshot(q, s => cb(s.docs.map(d => map(d.id, d.data()))), errCb);
  const logMap = (id, d) => Object.assign({}, d, { id, at: ms(d.at) });

  async function init(cfg, errHandler) {
    onErr = errHandler || onErr;
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [appM, authM, fsM] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
    ]);
    const app = appM.initializeApp(cfg);
    A = authM; F = fsM; auth = A.getAuth(app); db = F.getFirestore(app);
  }
  function onAuth(cb) {
    A.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: (u.email || '').toLowerCase(), name: u.displayName || u.email, photo: u.photoURL || '' } : null));
  }
  async function signIn() {
    const p = new A.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    try { await A.signInWithPopup(auth, p); }
    catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await A.signInWithRedirect(auth, p);
      else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') throw e;
    }
  }
  const signOut = () => A.signOut(auth);

  const getUser = async uid => { const s = await F.getDoc(ref('users', uid)); return s.exists() ? s.data() : null; };
  const watchUser = (uid, cb) => F.onSnapshot(ref('users', uid), s => cb(s.exists() ? s.data() : null), errCb);
  const createUser = (uid, d) => F.setDoc(ref('users', uid), d);
  const updateUser = (uid, p) => F.updateDoc(ref('users', uid), p);
  const deleteUser = uid => F.deleteDoc(ref('users', uid));
  const watchUsers = cb => listen(col('users'), (id, d) => d, cb);

  const getWhitelist = async em => { const s = await F.getDoc(ref('whitelist', em)); return s.exists() ? s.data() : null; };
  const watchWhitelist = cb => listen(col('whitelist'), (id, d) => Object.assign({ email: id }, d), cb);
  const addWhitelist = (em, d) => F.setDoc(ref('whitelist', em), d);
  const delWhitelist = em => F.deleteDoc(ref('whitelist', em));

  const watchTasks = cb => listen(col('tasks'), (id, d) => Object.assign({}, d, { id }), cb);
  const saveTask = t => F.setDoc(ref('tasks', t.id), t);
  const delTask = id => F.deleteDoc(ref('tasks', id));
  const watchSettings = cb => F.onSnapshot(ref('settings', 'main'), s => cb(s.exists() ? s.data() : {}), errCb);
  const saveSettings = o => F.setDoc(ref('settings', 'main'), o);

  const watchLogs = (uid, cb) => listen(F.query(col('logs'), F.where('uid', '==', uid)), logMap, cb);
  const addLog = l => F.setDoc(ref('logs', l.id), Object.assign({}, l, { at: F.serverTimestamp() }));
  const delLog = id => F.deleteDoc(ref('logs', id));
  // Все записи с фото (только для админа)
  const watchPhotos = cb => listen(F.query(col('logs'), F.where('hasPhoto', '==', true)), logMap, cb);
  // Решение по фото: фото удаляется, запись остаётся с отметкой
  const decidePhoto = (id, patch) => F.updateDoc(ref('logs', id), Object.assign({}, patch, { hasPhoto: false, photo: F.deleteField() }));
  const updateLog = (id, patch) => F.updateDoc(ref('logs', id), patch);

  // Рейтинг семьи: короткие карточки с цифрами (без фото)
  const watchScores = cb => listen(col('scores'), (id, d) => Object.assign({}, d, { uid: id, updatedAt: ms(d.updatedAt) }), cb);
  const saveScore = (uid, d) => F.setDoc(ref('scores', uid), Object.assign({}, d, { uid, updatedAt: F.serverTimestamp() }));

  // Заявки на награды (магазин и сундуки)
  const watchClaims = cb => listen(col('claims'), (id, d) => Object.assign({}, d, { id }), cb);
  const watchMyClaims = (uid, cb) => listen(F.query(col('claims'), F.where('uid', '==', uid)), (id, d) => Object.assign({}, d, { id }), cb);
  const addClaim = c => F.setDoc(ref('claims', c.id), c);
  const updateClaim = (id, p) => F.updateDoc(ref('claims', id), p);
  // Семейные рецепты
  const watchRecipes = cb => listen(col('recipes'), (id, d) => Object.assign({}, d, { id }), cb);
  const saveRecipe = r => F.setDoc(ref('recipes', r.id), r);
  const delRecipe = id => F.deleteDoc(ref('recipes', id));
  // Общие данные семьи (план подготовки к праздникам)
  const watchShared = (id, cb) => F.onSnapshot(ref('shared', id), s => cb(s.exists() ? s.data() : {}), errCb);
  const saveShared = (id, o) => F.setDoc(ref('shared', id), o, { merge: true });
  // Резервная копия: прочитать коллекцию целиком (только админ)
  const dumpCol = async n => (await F.getDocs(col(n))).docs.map(d => Object.assign({ _id: d.id }, d.data()));
  const restoreDoc = (n, id, d) => F.setDoc(ref(n, id), d);

  const watchPayouts = cb => listen(col('payouts'), (id, d) => Object.assign({}, d, { id }), cb);
  const watchMyPayouts = (uid, cb) => listen(F.query(col('payouts'), F.where('uid', '==', uid)), (id, d) => Object.assign({}, d, { id }), cb);
  const addPayout = p => F.setDoc(ref('payouts', p.id), p);
  const updatePayout = (id, p) => F.updateDoc(ref('payouts', id), p);

  return { demo: false, init, onAuth, signIn, signOut, getUser, watchUser, createUser, updateUser, deleteUser, watchUsers,
    getWhitelist, watchWhitelist, addWhitelist, delWhitelist, watchTasks, saveTask, delTask, watchSettings, saveSettings,
    watchLogs, addLog, delLog, watchPhotos, decidePhoto, updateLog, watchPayouts, watchMyPayouts, addPayout, updatePayout, watchScores, saveScore,
    watchClaims, watchMyClaims, addClaim, updateClaim, watchRecipes, saveRecipe, delRecipe, watchShared, saveShared, dumpCol, restoreDoc };
})();

async function createMe(au) {

  else {
    let w = null;

/* ---------- время: пропуски, бонусы, фото ---------- */
async function runAutoMiss() {
  if (S.amBusy || !S.me || S.me.status !== 'approved' || !S.logsLoaded || !S.tasksLoaded) return;
  const now = clock();
  const miss = Logic.pendingMisses(S.tasks, S.logs, S.me, now, S.settings).filter(m => (S.amTried[m.id] || 0) < 3);
  if (!miss.length) return;
  S.amBusy = true;
  const written = [];
  for (const m of miss) {
    S.amTried[m.id] = (S.amTried[m.id] || 0) + 1;
    try { await Store.addLog(m); written.push(m); } catch (e) { console.warn('пропуск не записан', m.id, e && e.message); }
  }
  S.amBusy = false;
  if (written.length) feedbackMiss(written, true);
}

// Бонусы: серия за день, идеальная неделя (прошлая), идеальный месяц (прошлый)
async function runBonuses() {
  if (S.bnBusy || !S.me || S.me.status !== 'approved' || !S.logsLoaded || !S.tasksLoaded) return;
  const now = clock(), idx = Logic.logIndex(S.logs), appr = S.me.approvedDate || '';
  const cands = [];
  const td = Logic.dayBonus(S.tasks, S.logs, S.me, now.date, now, S.settings);
  if (td) cands.push(td);
  for (let k = 1; k <= 2; k++) {
    const ws = Logic.weekStart(Logic.addDays(now.date, -7 * k));
    if (Logic.addDays(ws, 6) < appr) break;
    const wb = Logic.weekBonus(S.tasks, S.logs, S.me, ws, now, S.settings);
    if (wb) cands.push(wb);
  }
  const pm = Logic.prevMonth(Logic.monthOf(now.date));
  if (Logic.lastDayOf(pm) >= appr) {
    const mb = Logic.monthBonus(S.tasks, S.logs, S.me, pm, now, S.settings);
    if (mb) cands.push(mb);
  }
  const fresh = cands.filter(b => !idx.has(b.id));
  if (!fresh.length) return;
  S.bnBusy = true;
  for (const b of fresh) {
    try {
      await Store.addLog(b);
      banner('good', '🎁 ' + kindLabel(b), '+' + M(b.delta) + ' ' + T('coins'), 4200);
      play('fanfare');
    } catch (e) { console.warn('бонус не записан', b.id, e && e.message); }
  }
  S.bnBusy = false;
}

// Фото старше двух суток удаляются (делает админ, который открыл приложение)
async function cleanupPhotos() {
  if (!isAdmin()) return;
  const now = Date.now();
  for (const p of S.photos) {
    if (!Logic.photoExpired(p, now) || (S.amTried['ph_' + p.id] || 0) >= 2) continue;
    S.amTried['ph_' + p.id] = (S.amTried['ph_' + p.id] || 0) + 1;
    try { await Store.decidePhoto(p.id, { review: 'expired' }); } catch (e) { console.warn('фото не удалено', p.id); }
  }
}

function feedbackMiss(logs, auto) {
  const c = cfgS(), now = clock();
  const todays = logs.filter(m => m.date === now.date);
  const worst = logs.find(m => m.burn > 0) || todays[todays.length - 1] || logs[logs.length - 1];
  const total = logs.reduce((s, m) => s + m.delta, 0);
  if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 500]);
  redFlash();
  if (worst.burn > 0) { play('burn'); banner('burn', T('burn_msg', { p: c.burnPct }), T('warn_pen', { c: M(-total) }), 5200); }
  else if (worst.warn) { play('warn'); banner('warn', T('warn_n', { n: worst.strike, m: c.warnings }), T('warn_pen', { c: M(-total) }), 5200); }
  else { play('wrong'); banner('warn', T('st_failed'), T('warn_pen', { c: M(-total) }), 4200); }
  if (auto && logs.length > 1) setTimeout(() => banner('warn', T('away_missed', { n: logs.length, c: sgn(total) }), '', 4200), 600);
}

function animateBalance(target) {
  const from = S.shown, t0 = performance.now(), dur = 900;
  const pill = document.getElementById('coinTarget');
  if (pill && target !== from) { pill.classList.remove('bump', 'drop'); void pill.offsetWidth; pill.classList.add(target > from ? 'bump' : 'drop'); if (target > from && typeof sparkle === 'function') setTimeout(sparkle, 650); }
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), v = Math.round(from + (target - from) * (1 - Math.pow(1 - k, 3)));
    S.shown = v;
    const el = document.getElementById('coinAmt');
    if (el) { el.textContent = M(v); el.className = v < 0 ? 'neg' : ''; }
    if (k < 1) requestAnimationFrame(step); else S.shown = target;
  };
  requestAnimationFrame(step);
}
function flyCoin(fromEl) {
  const to = document.getElementById('coinTarget'); if (!fromEl || !to || !fromEl.isConnected) return;
  const a = fromEl.getBoundingClientRect(), b = to.getBoundingClientRect();

// Фото только с камеры: видео с камеры телефона, без выбора из галереи
async function openCamera(onShot) {
  stopCam();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fileCamera(onShot); return; }
  modal(`<h3>${T('cam_title')}</h3><video id="cam" autoplay playsinline muted></video><canvas id="shot" style="display:none"></canvas>`
    + `<div id="camErr" class="mut"></div><div class="btnrow"><button class="btn gold" data-act="snap">📷 ${T('snap')}</button><button class="btn" data-act="camcancel">${T('cancel')}</button></div>`);
  CAM = { onShot, stream: null };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    if (!CAM) { stream.getTracks().forEach(t => t.stop()); return; }
    CAM.stream = stream;
    const v = $('#cam'); if (v) { v.srcObject = stream; v.play().catch(() => {}); }
  } catch (e) {

    banner('warn', T('cam_fail'), '', 3500);

function fileCamera(onShot) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => compress(r.result, onShot); r.readAsDataURL(f);
  };
  banner('warn', T('cam_fallback'), '', 3000);
  inp.click();
}
// Сжатие: до 800 px по ширине, JPEG 0.5 (≈ 50–100 КБ)
function compress(src, cb) {
  const img = new Image();
  img.onload = () => {
    const sc2 = Math.min(1, 800 / img.width), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * sc2); cv.height = Math.round(img.height * sc2);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', 0.5));
  };
  img.src = src;
}

      + MENU.map(([k, i, t, sub]) => `<button class="folder" data-act="menu" data-id="${k}"><span class="fi">${i}</span><b>${T(t)}</b><small>${T(sub)}</small>`
        + (k === 'events' && soon ? `<em>${esc(soon.icon || '🎉')} ${soon.left === 0 ? T('ev_today') : T('ev_in', { n: soon.left })}</em>` : '') + `</button>`).join('') + `</div>`;
  }
  const body = { kids: viewKids, kitchen: viewKitchen, events: viewEvents, family: viewFamily, cards: viewCards, contacts: viewContacts }[m[0]]();
  return `<div class="crumbs"><button data-act="menu" data-id="">📂 ${T('nav_menu')}</button><span>›</span><b>${m[1]} ${T(m[2])}</b></div>` + body;
}
// Подпись расписания задания
function schedTxt(t) {
  if (t.once) { const [, mm, dd] = t.once.split('-'); return T('sched_once_short', { d: `${dd}.${mm}` }); }
  if (Array.isArray(t.days) && t.days.length && t.days.length < 7) return t.days.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => WDS[S.lang][d]).join(', ');
  return T('sched_daily_short');
}

function viewToday() {
  const now = clock(), me = S.me, idx = Logic.logIndex(S.logs);
  const ts = myTasks(now.date);
  const states = ts.map(t => { const log = idx.get(Logic.logId(me.uid, now.date, t.id)); return { t, log, st: Logic.taskState(t, now.date, now, log) }; });
  const ds = Logic.dayStats(S.tasks, S.logs, me, now.date, now);
  const todayNet = S.logs.filter(l => l.date === now.date).reduce((a, l) => a + (l.delta || 0), 0);
  const actives = states.filter(s => s.st === 'active'), next = states.find(s => s.st === 'locked');
  let out = '';
  if (!ts.length) {
    out += `<div class="hero"><div class="heroi">🌅</div><h2>${T('no_tasks')}</h2>${isAdmin() ? `<div class="mut">${T('no_tasks_admin')}</div><div class="btnrow" style="justify-content:center"><button class="btn gold" data-act="admin">⚙️ ${T('admin_panel')}</button></div>` : ''}</div>`;
  } else if (actives.length) {
    const a = actives[0], t = a.t, mode = Logic.photoMode(t);
    const until = Logic.fmtMin(Logic.toMin(t.time) + (t.graceMin ?? 60)), left = Logic.toMin(t.time) + (t.graceMin ?? 60) - now.min;
    out += `<div class="hero now"><span class="nowtag">⚡ ${T('now')}</span><div class="heroi">${esc(t.icon || '⭐')}</div><h1>${esc(loc(t.title))}</h1>`
      + `<div class="heromut">${T('until', { t: until })} · ${T('left_t', { t: fmtDur(Math.max(0, left)) })}</div>`
      + `<button class="big green pulse herobtn" data-act="done" data-id="${esc(t.id)}">${mode === 'req' ? '📷 ' + T('photo_req_btn').replace(/^📷\s*/, '') : '✅ ' + T('done_btn').replace(/[✔✓]/g, '').trim()} <b>+${M(t.reward)}</b></button>`
      + `<div class="herosub">${howtoFor(t) ? `<button class="btn" data-act="howto" data-id="${esc(t.id)}">ℹ️ ${T('howto_btn')}</button>` : ''}${mode === 'opt' ? `<button class="btn" data-act="photodone" data-id="${esc(t.id)}">📷 ${T('photo_opt_btn').replace(/^📷\s*/, '')}</button>` : ''}<button class="btn ghostred" data-act="fail" data-id="${esc(t.id)}">✗ ${T('fail_btn')}</button></div></div>`;
  } else if (next) {
    const t = next.t, opens = Logic.toMin(t.time) - (t.earlyMin ?? 15);
    out += `<div class="hero next"><span class="nowtag">${T('next_task')}</span><div class="heroi">${esc(t.icon || '⭐')}</div><h2>${esc(t.time)} — ${esc(loc(t.title))}</h2>`
      + `<div class="countdown">⏳ ${T('in_t', { t: fmtDur(Math.max(0, opens - now.min)) })}</div><div class="heromut">${T('reward_will', { c: M(t.reward) })}</div></div>`;
  } else {
    out += `<div class="hero done"><div class="heroi">🏆</div><h2>${T('all_done_today')}</h2><div class="heromut">${T('today_earned', { c: sgn(todayNet) })}</div></div>`;
  }
  if (ts.length) {
    out += `<div class="card daycard"><div class="dayrow"><b>${T('day_progress', { d: ds.done, n: ds.total })}</b><span class="${todayNet < 0 ? 'neg' : 'pos'}">${sgn(todayNet)}</span></div>`
      + `<div class="pbar"><i style="width:${ds.total ? Math.round(ds.done / ds.total * 100) : 0}%"></i></div></div>`;
    out += `<div class="tlist">` + states.map(({ t, log, st }, i) => {
      const isHero = actives.length && actives[0].t.id === t.id;
      const badge = st === 'done' ? (log.review === 'rejected' ? `<span class="tbadge bad">✗</span>` : `<span class="tbadge ok">✓ ${sgn(log.delta)}</span>`)
        : (st === 'missed' || st === 'failed') ? `<span class="tbadge bad">✗ ${sgn(log.delta)}</span>`
        : st === 'expired' ? `<span class="tbadge bad">⌛</span>`
        : st === 'active' ? (isHero ? `<span class="tbadge now">⚡ ${T('now')}</span>` : `<button class="btn green sm" data-act="done" data-id="${esc(t.id)}">✅ +${M(t.reward)}</button>`)
        : `<span class="tbadge mut">+${M(t.reward)}</span>`;
      const photoNote = st === 'done' && log.review === 'pending' ? ` · 📷 ${T('photo_pending')}` : '';
      return `<div class="trow2 st-${st}"><span class="ttime">${esc(t.time)}</span><span class="ticon">${esc(t.icon || '•')}</span><div class="tmain"><b>${esc(loc(t.title))}</b><small>🔁 ${esc(schedTxt(t))}${photoNote}</small></div>${howtoFor(t) ? `<button class="hbtn" data-act="howto" data-id="${esc(t.id)}" aria-label="how">ℹ️</button>` : ''}${badge}</div>`;
    }).join('') + `</div>`;
  }
  out += eventsCard(now);
  celebrate(now);
  return out;
}

/* ---------- рейтинг семьи ---------- */
const pctTxt = p => (p === null || p === undefined ? '—' : p + '%');
const pctW = p => (p === null || p === undefined ? 0 : Math.max(0, Math.min(100, p)));
function familyRows() {
  const today = clock().date;
  return S.scores.filter(x => x && x.uid && (x.todayTotal || x.earned || x.weekDone || x.weekMissed))
    .map(x => (x.date === today ? x : Object.assign({}, x, { todayDone: 0, todayMissed: 0, todayPct: x.todayTotal ? 0 : null, stale: true })))
    .sort((a, b) => ((b.weekPct ?? -1) - (a.weekPct ?? -1)) || ((b.todayPct ?? -1) - (a.todayPct ?? -1)) || ((b.monthNet || 0) - (a.monthNet || 0)));
}
function viewFamily() {
  const rows = familyRows();
  let out = `<div class="card"><h2>🏆 ${T('fam_title')}</h2><div class="mut">${T('fam_hint')}</div>`;
  if ('Notification' in window && Notification.permission === 'default') out += `<div class="btnrow"><button class="btn sm" data-act="notif">🔔 ${T('notif_btn')}</button></div>`;
  out += `</div>`;
  if (!rows.length) return out + `<div class="card center">${T('fam_empty')}</div>`;
  const leader = rows.length > 1 && (rows[0].weekPct ?? -1) > (rows[1].weekPct ?? -1) ? rows[0].uid : '';
  out += rows.map((r, i) => {
    const me = r.uid === S.me.uid, L = Logic.level(r.earned || 0);
    const bar = (lab, p, extra) => `<div class="fbar"><span>${lab}</span><div class="pbar"><i style="width:${pctW(p)}%"></i></div><b>${pctTxt(p)}</b></div>${extra ? `<div class="mut fsub">${extra}</div>` : ''}`;
    const last = r.last && r.last.title ? `<div class="mut">${T('fam_last')}: ${esc(r.last.icon || '')} ${esc(loc(r.last.title))} · ${r.last.kind === 'done' ? '✅' : '❌'}</div>` : '';
    return `<div class="card fam ${r.uid === leader ? 'lead' : ''} ${me ? 'me' : ''}">`
      + `<div class="urow">${avatar(r)}<div style="min-width:0"><b>${r.uid === leader ? '👑 ' : ''}${i + 1}. ${esc(r.name)}${me ? ' · ' + T('fam_you') : ''}</b><div class="mut">${esc(loc(L.name))}${r.relation ? ' · ' + esc(r.relation === 'owner' && !me ? T('rel_owner_other') : relLabel(r.relation)) : ''}${r.streak ? ' · 🔥 ' + T('fam_streak', { n: r.streak }) : ''}</div></div></div>`
      + bar(T('fam_today'), r.todayPct, r.todayTotal ? T('fam_done_of', { d: r.todayDone || 0, n: r.todayTotal, m: r.todayMissed || 0 }) : T('fam_no_tasks'))
      + bar(T('fam_week'), r.weekPct, T('fam_dm', { d: r.weekDone || 0, m: r.weekMissed || 0 }))
      + bar(T('fam_month'), r.monthPct, T('fam_dm', { d: r.monthDone || 0, m: r.monthMissed || 0 }))
      + `<div class="grid2" style="margin-top:8px"><div class="stat"><b class="${(r.monthNet || 0) < 0 ? 'neg' : ''}">${sgn(r.monthNet || 0)}</b><div class="mut">${T('fam_month_coins')}</div></div>`
      + `<div class="stat"><b>${M(r.earned || 0)}</b><div class="mut">${T('earned_total')}</div></div></div>${last}`
      + `<div class="btnrow"><button class="btn sm" data-act="utasks" data-uid="${esc(r.uid)}">📋 ${T('tab_tasks')}</button></div></div>`;
  }).join('');
  if (rows.length > 1) {
    const metrics = [['fam_today', 'todayPct'], ['fam_week', 'weekPct'], ['fam_month', 'monthPct']];
    out += `<div class="card"><h3>📊 ${T('fam_compare')}</h3>` + metrics.map(([lab, k]) => `<div class="cmp"><div class="mut">${T(lab)}</div>`
      + rows.map(r => `<div class="fbar"><span>${esc(firstName(r.name))}</span><div class="pbar ${r.uid === S.me.uid ? 'mine' : ''}"><i style="width:${pctW(r[k])}%"></i></div><b>${pctTxt(r[k])}</b></div>`).join('') + `</div>`).join('') + `</div>`;
  }
  return out;
}

function weekCard(now, c) {
  const me = S.me, ws = Logic.weekStart(now.date);
  const cur = Logic.weekReport(S.tasks, S.logs, me, ws, now, S.settings);
  let won = '';
  for (let k = 1; k <= 6; k++) {
    const start = Logic.addDays(ws, -7 * k);
    if (Logic.addDays(start, 6) < (me.approvedDate || '')) break;
    const r = Logic.weekReport(S.tasks, S.logs, me, start, now, S.settings);
    if (r.won && r.prize) won += `<div class="prize"><span class="pi">${esc(r.prize.icon)}</span><div><b>${T('prize_won')}</b><div>${esc(loc(r.prize))}</div><div class="mut">${esc(start)} · ${T('prize_note')}</div></div></div>`;
  }
  return `<div class="card"><h2>🎁 ${T('prizes_title')}</h2><div class="mut">${T('week_progress', { p: Math.round(cur.rate * 100), g: c.weeklyGoalPct })}</div><div class="pbar"><i style="width:${Math.round(cur.rate * 100)}%"></i></div>${won || `<div class="mut">${T('no_prize_yet')}</div>`}</div>`;
}

function monthCard(now, c) {
  const me = S.me, ym = Logic.monthOf(now.date);
  const mr = Logic.monthReport(S.tasks, S.logs, me, ym, now);
  const lead = (Logic.weekday(`${ym}-01`) + 6) % 7;
  const cells = CALH[S.lang].map(h => `<div class="h">${h}</div>`).join('')
    + '<div></div>'.repeat(lead)
    + mr.days.map((d, i) => {
      const cls = d.future || d.rate === null ? '' : d.rate >= .8 ? 'g' : d.rate >= .5 ? 'y' : 'r';
      return `<div class="d ${cls} ${d.today ? 't' : ''}">${i + 1}</div>`;
    }).join('');
  const rate = c.usdPerCoin;
  const usdNow = Logic.toUsd(Math.max(0, mr.net), rate).toFixed(2);
  const rq = S.myPayouts.find(p => p.month === ym);
  let pay;
  if (rq) pay = `<div class="mut">${rq.status === 'paid' ? '✅ ' + T('payout_paid') : rq.status === 'rejected' ? T('payout_rejected') : '⏳ ' + T('payout_wait')}</div>`;
  else if (!Logic.payoutDay(now, ym)) pay = `<div class="mut">${T('payout_day_only', { d: Logic.lastDayOf(ym) })}</div>`;
  else if (mr.net <= 0) pay = `<div class="mut">${T('payout_none')}</div>`;
  else if (!(rate > 0)) pay = `<div class="mut">${T('rate_not_set')}</div>`;
  else pay = `<div class="btnrow"><button class="btn gold" data-act="payout" data-m="${ym}" data-c="${mr.net}">${T('request_payout')} · $${usdNow}</button></div>`;
  const past = S.myPayouts.filter(p => p.month !== ym).sort((a, b) => String(b.month).localeCompare(String(a.month))).slice(0, 6)
    .map(p => `<div class="prize"><span class="pi">💵</span><div><b>${esc(p.month)}</b>: ${M(p.coins)} ${T('coins')}${p.usd ? ` ≈ $${Number(p.usd).toFixed(2)}` : ''}<div class="mut">${p.status === 'paid' ? '✅ ' + T('payout_paid') : p.status === 'rejected' ? T('payout_rejected') : '⏳ ' + T('payout_wait')}</div></div></div>`).join('');
  return `<div class="card"><h2>📅 ${T('month_plan')}</h2><div class="cal">${cells}</div>`
    + `<div style="margin-top:10px"><b>${T('earned_month')}:</b> <span style="color:var(--gold);font-weight:900">${sgn(mr.net)}</span> ${T('coins')}${rate > 0 ? ` ≈ $${usdNow}` : ''}</div>`
    + `<h3 style="margin-top:12px">💵 ${T('payout_title')}</h3><div class="mut">${T('payout_hint')}</div>${pay}${past}</div>`;
}

async function completeTask(t, now, photo, el) {
  const idx = Logic.logIndex(S.logs);
  if (Logic.taskState(t, now.date, now, idx.get(Logic.logId(S.me.uid, now.date, t.id))) !== 'active') return;
  if (Logic.photoMode(t) === 'req' && !photo) { banner('warn', T('photo_req_note'), '', 3000); return; }
  document.querySelectorAll('.big').forEach(b => { b.disabled = true; });
  flyCoin(el);
  play('coin');
  await Store.addLog(Logic.doneLog(S.me, t, now, photo));
}

  await completeTask(t, now, null, el);
});

    const idx = Logic.logIndex(S.logs);

    await Store.addLog(m); feedbackMiss([m], false);

};

  const p = document.querySelector(`[data-snd="${k}"][data-part="p"]`).value;
  const u = (document.querySelector(`[data-snd="${k}"][data-part="u"]`) || { value: '' }).value.trim();
  Snd.play(k, { p, u });
};
ACT.sndreset = el => {
  const k = el.dataset.id, p = document.querySelector(`[data-snd="${k}"][data-part="p"]`), u = document.querySelector(`[data-snd="${k}"][data-part="u"]`);
  if (p) p.value = k === 'music' ? 'chords' : (SND_DEFAULT[k] || k);
  if (u) u.value = '';
  banner('good', '↺ ' + T('snd_reset_done'), T('snd_reset_save'), 2200);
};
ACT.voiceAll = () => guarded(() => Store.saveSettings(Object.assign({}, S.settings, { voice: (S.settings || {}).voice === false })));
ACT.voiceToggle = () => { safeSet('fp_voice', safeGet('fp_voice') === '0' ? '1' : '0'); render(); };
ACT.home = () => { S.adminOpen = false; S.htab = 'today'; S.menu = ''; route(); render(); window.scrollTo(0, 0); };
ACT.menu = el => { S.menu = el.dataset.id; S.htab = 'menu'; render(); window.scrollTo(0, 0); };
ACT.tfor = el => { S.tfor = el.dataset.id; render(); };
ACT.howtoggle = (el, e) => { e.preventDefault(); S.howOpen = !S.howOpen; render(); };
// Задания человека: что назначено и что сделано сегодня
ACT.utasks = el => {
  const uid = el.dataset.uid, u = S.users.find(x => x.uid === uid) || S.scores.find(x => x.uid === uid) || { uid, name: '?' };
  const now = clock(), ts = Logic.sortTasks(S.tasks.filter(t => Logic.assigned(t, Object.assign({ approvedDate: '' }, u), now.date)));
  const show = logs => {
    const idx = Logic.logIndex(logs || []);
    modal(`<h2>📋 ${esc(u.name)}</h2><div class="mut">${esc(fmtDate(now))}</div><div class="tlist">`
      + (ts.length ? ts.map(t => { const st = logs ? Logic.taskState(t, now.date, now, idx.get(Logic.logId(uid, now.date, t.id))) : 'plan';
        const b = st === 'done' ? '<span class="tbadge ok">✓</span>' : (st === 'missed' || st === 'failed' || st === 'expired') ? '<span class="tbadge bad">✗</span>' : st === 'active' ? `<span class="tbadge now">⚡</span>` : `<span class="tbadge mut">+${M(t.reward)}</span>`;
        return `<div class="trow2 st-${st}"><span class="ttime">${esc(t.time)}</span><span class="ticon">${esc(t.icon || '•')}</span><div class="tmain"><b>${esc(loc(t.title))}</b><small>🔁 ${esc(schedTxt(t))}</small></div>${b}</div>`; }).join('')
        : `<div class="mut">${T('fam_no_tasks')}</div>`)
      + `</div><div class="btnrow"><button class="btn" data-act="close">${T('close')}</button></div>`);
  };
  if (!isAdmin()) { show(null); return; }
  let un = null, got = false;
  un = Store.watchLogs(uid, logs => { if (got) return; got = true; setTimeout(() => un && un(), 0); show(logs); });
};
ACT.sndsave = () => guarded(async () => {
  const sounds = {};
  const read = k => {
    const p = document.querySelector(`[data-snd="${k}"][data-part="p"]`), u = document.querySelector(`[data-snd="${k}"][data-part="u"]`);
    return { p: p ? p.value : undefined, u: u ? u.value.trim() : '' };
  };
  EV_SOUNDS.forEach(([k]) => { sounds[k] = read(k); });
  sounds.music = read('music');
  await Store.saveSettings(Object.assign({}, S.settings, { sounds }));
  const ok = $('#sndOk'); if (ok) ok.textContent = '✓ ' + T('saved_ok');
});
ACT.paid = el => guarded(async () => {
  const p = S.payouts.find(x => x.id === el.dataset.id); if (!p) return;
  await Store.addLog({ id: `adj_pay_${p.id}`, uid: p.uid, date: clock().date, taskId: 'payout', kind: 'payout', delta: -Math.abs(p.coins), note: p.month });
  await Store.updatePayout(p.id, { status: 'paid' });
});
ACT.rejpay = el => guarded(() => Store.updatePayout(el.dataset.id, { status: 'rejected' }));

/* ---------- события ---------- */
document.addEventListener('click', e => {
  Snd.unlock();
  if (S.music && !Snd.on && !S.quiet) Snd.startMusic();
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.actChange === 'lang') {
    S.lang = t.value; safeSet('fp_lang', S.lang);
    if (S.me) Store.updateUser(S.me.uid, { lang: S.lang }).catch(() => {});
    render(); return;
  }
  if (t.dataset.uf) {
    const uid = t.dataset.uid, u = S.users.find(x => x.uid === uid); if (!u) return;
    const val = t.type === 'checkbox' ? t.checked : t.value;
    if (u.status === 'approved') {
      if (t.dataset.uf === 'isAdmin') ask(T('confirm_admin'), () => Store.updateUser(uid, { isAdmin: val }));
      else Store.updateUser(uid, { relation: val }).catch(console.error);
      if (t.dataset.uf === 'isAdmin') setTimeout(render, 0);
    } else { S.sel[uid] = Object.assign(S.sel[uid] || {}, { [t.dataset.uf]: val }); }
  }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (S.dirty && !typing()) render(); }, 50); });

window.addEventListener('DOMContentLoaded', () => {
  const o = document.createElement('div'); o.id = 'ovl'; document.body.appendChild(o);
  boot();
});
window.__app = { S, tick, clock, render, Logic };

function howtoFor(t) {
  if (!t) return null;
  const id = String(t.id || ''), ti = JSON.stringify(t.title || '').toLowerCase();
  if (id === 'wake' || /подъём|подъем|просып|uyg'on/.test(ti)) return HOWTO.wake;
  if (id.startsWith('teeth') || /зуб|tish/.test(ti)) return HOWTO.teeth;
  if (id === 'medicine' || /лекар|кальц|препарат|dori/.test(ti)) return HOWTO.medicine;
  if (id === 'nap' || /дневной сон|kunduzgi uyqu/.test(ti)) return HOWTO.nap;
  if (id === 'sleep' || /отбой|сон|uxlash/.test(ti)) return HOWTO.sleep;
  if (/купа|ванн|cho'mil/.test(ti)) return HOWTO.bath;
  if (['breakfast', 'lunch', 'snack', 'dinner'].includes(id) || /завтрак|обед|ужин|полдник|nonushta|tushlik|ovqat|tamaddi/.test(ti)) return HOWTO.meal;
  return null;
}

/* ---------- YouTube ---------- */
function ytParse(url) {
  const u = String(url || '').trim();
  if (!/youtu\.?be/.test(u)) return null;
  const list = (u.match(/[?&]list=([\w-]+)/) || [])[1] || '';
  const m = u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  const vid = m ? m[1] : '';
  return vid || list ? { vid, list } : null;
}
function ytEmbed(p) {
  const q = 'autoplay=1&rel=0&playsinline=1';
  return p.vid ? `https://www.youtube-nocookie.com/embed/${p.vid}?${q}${p.list ? '&list=' + p.list : ''}`
    : `https://www.youtube-nocookie.com/embed/videoseries?list=${p.list}&${q}`;
}
function videoTile(v) {
  const p = ytParse(v.url); if (!p) return '';
  const thumb = p.vid ? `<img src="https://i.ytimg.com/vi/${p.vid}/hqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="plthumb">📃</div>`;
  return `<button class="vtile" data-act="vplay" data-id="${esc(v.id)}">${thumb}<span class="vplay">▶</span>`
    + `<span class="vt">${p.list ? '📃 ' : ''}${esc(v.title || (p.list ? T('playlist') : 'YouTube'))}</span></button>`;
}
// Видео открывается в отдельном окне: обновление экрана его не перезапускает

};

  const p = ytParse(url); if (!p) return;
  S.quiet = true; Snd.stopMusic();
  const m = modal(`<div class="vhead"><h3>${esc(title || 'YouTube')}</h3><button class="lockbtn" id="vLock" aria-label="lock">🔒</button></div>`
    + `<div class="vwrap"><iframe src="${ytEmbed(p)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="vshield"></div></div>`

// Искры у счёта монет
function sparkle() {
  const to = document.getElementById('coinTarget'); if (!to) return;
  const r = to.getBoundingClientRect();
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span'); s.className = 'spark'; s.textContent = i % 2 ? '✦' : '✧';
    s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + r.height / 2) + 'px';
    const a = (i / 10) * Math.PI * 2, d = 40 + Math.random() * 30;
    s.animate([{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * d}px),calc(-50% + ${Math.sin(a) * d}px)) scale(1.2)`, opacity: 0 }], { duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => s.remove();
    document.body.appendChild(s);
  }
}
function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = { uz: 'uz-UZ', ru: 'ru-RU', en: 'en-US' }[S.lang];
    const vs = speechSynthesis.getVoices();
    if (!vs.some(v => v.lang && v.lang.toLowerCase().startsWith(S.lang))) u.lang = S.lang === 'uz' ? 'ru-RU' : u.lang;
    u.rate = 0.9; u.pitch = 1.2;
    speechSynthesis.speak(u);
  } catch (e) { /* без голоса */ }
}

function gameMemory() {
  const icons = ['🐶', '🐱', '🐰', '🐻', '🐸', '🦁'];
  const deck = icons.concat(icons).map((e, i) => ({ e, k: Math.random() + i * 0 })).sort((a, b) => a.k - b.k).map(x => x.e);
  const m = gameShell('🃏 ' + T('g_memory'), `<div class="mgrid">${deck.map((e, i) => `<button class="mcard" data-i="${i}"><span>${e}</span></button>`).join('')}</div>`);
  let open = [], found = 0, moves = 0, lock = false;
  const sc2 = m.querySelector('#gscore');
  m.querySelectorAll('.mcard').forEach(c => {
    c.onclick = e => {
      e.stopPropagation();
      if (lock || c.classList.contains('up')) return;
      c.classList.add('up'); open.push(c);
      if (open.length < 2) return;
      moves++; sc2.textContent = '👆 ' + moves;
      const [a, b] = open;
      if (a.textContent === b.textContent) {
        open = []; found++; Snd.coin();
        a.classList.add('ok'); b.classList.add('ok');
        if (found === icons.length) { setTimeout(() => { confetti(); play('fanfare'); speak(T('g_win')); }, 300); }
      } else {
        lock = true;
        setTimeout(() => { a.classList.remove('up'); b.classList.remove('up'); open = []; lock = false; }, 800);
      }
    };
  });
}

/* ---------- погода (Open-Meteo, без ключа) ---------- */
const DEFAULT_CITY = { name: 'Navoiy', lat: 40.0844, lon: 65.3792 };
const cityOf = () => (S.settings && S.settings.weatherCity && S.settings.weatherCity.lat ? S.settings.weatherCity : DEFAULT_CITY);
const WMO = c => (c === 0 ? ['☀️', 'w_clear'] : c <= 2 ? ['🌤️', 'w_partly'] : c === 3 ? ['☁️', 'w_cloudy'] : c <= 48 ? ['🌫️', 'w_fog'] : c <= 57 ? ['🌦️', 'w_drizzle'] : c <= 67 ? ['🌧️', 'w_rain'] : c <= 77 ? ['❄️', 'w_snow'] : c <= 82 ? ['🌧️', 'w_rain'] : c <= 86 ? ['🌨️', 'w_snow'] : ['⛈️', 'w_storm']);
function loadWeather() {
  const c = cityOf(), key = c.lat + ',' + c.lon;
  if (S.wx && S.wx.key === key && Date.now() - S.wx.t < 30 * 60000) return;
  if (S.wxBusy) return;
  S.wxBusy = true;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2`;
  fetch(url).then(r => r.json()).then(d => {
    if (d && d.current) { S.wx = { key, t: Date.now(), now: d.current, daily: d.daily }; render(); }
  }).catch(() => { /* без погоды */ }).finally(() => { S.wxBusy = false; });
}
function weatherLine() {
  loadWeather();
  const w = S.wx; if (!w || !w.now) return '';
  const [ic, k] = WMO(w.now.weather_code), d = w.daily || {};
  const tm = d.temperature_2m_max && d.temperature_2m_max[1] !== undefined ? ` · ${T('w_tomorrow')} ${Math.round(d.temperature_2m_min[1])}…${Math.round(d.temperature_2m_max[1])}° ${WMO(d.weather_code[1])[0]}` : '';
  return `<div class="wx"><span class="wxi">${ic}</span><b>${Math.round(w.now.temperature_2m)}°</b><span>${esc(cityOf().name)} · ${T(k)}${tm}</span></div>`;
}

const keepCardInputs = () => { const a = $('#cardTo'), b = $('#cardFrom'); if (a) S.card.to = a.value; if (b) S.card.from = b.value; };
function wrapLines(ctx, text, maxW) {
  const words = String(text).split(/\s+/), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur); return lines;
}
function drawCard() {
  const c = S.card, [icon, key] = CARD_PRESETS[c.p], th = CARD_THEMES[c.th];
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const g = x.createRadialGradient(W / 2, H * 0.25, 50, W / 2, H / 2, H * 0.8); g.addColorStop(0, th[1]); g.addColorStop(1, th[2]);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 140; i++) { x.fillStyle = `rgba(255,220,120,${Math.random() * 0.6})`; x.beginPath(); x.arc(Math.random() * W, Math.random() * H, Math.random() * 2.6, 0, 7); x.fill(); }
  x.strokeStyle = th[3]; x.lineWidth = 6; x.globalAlpha = 0.85; x.beginPath(); x.roundRect ? x.roundRect(48, 48, W - 96, H - 96, 48) : x.rect(48, 48, W - 96, H - 96); x.stroke(); x.globalAlpha = 1;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '260px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.fillText(icon, W / 2, 360);
  const gold = x.createLinearGradient(0, 520, 0, 760); gold.addColorStop(0, '#fff6c2'); gold.addColorStop(0.5, th[3]); gold.addColorStop(1, '#e0951a');
  x.fillStyle = gold; x.shadowColor = 'rgba(255,210,63,.55)'; x.shadowBlur = 30;
  x.font = '900 92px Nunito, "Arial Rounded MT Bold", Arial, sans-serif';
  const greet = T(key), title = c.to && c.to.trim() ? c.to.trim() + ', ' + greet.charAt(0).toLocaleLowerCase() + greet.slice(1) : greet;
  const lines = wrapLines(x, title, W - 200);
  lines.forEach((l, i) => x.fillText(l, W / 2, 620 + i * 108 - (lines.length - 1) * 54));
  x.shadowBlur = 0; x.fillStyle = '#ffffff'; x.font = '700 50px Nunito, Arial, sans-serif';
  wrapLines(x, T(key + '_wish'), W - 220).forEach((l, i) => x.fillText(l, W / 2, 900 + i * 66));
  if (c.from) { x.fillStyle = th[3]; x.font = '800 54px Nunito, Arial, sans-serif'; x.fillText('— ' + c.from.trim(), W / 2, 1150); }
  x.fillStyle = 'rgba(255,255,255,.45)'; x.font = '700 30px Nunito, Arial, sans-serif'; x.fillText('NEW DAY ✦', W / 2, H - 92);
  return cv;
}
ACT.cmake = () => {

function drawCardX(o) {
  const th = CARD_THEMES[o.th || 0], W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const g = x.createRadialGradient(W / 2, H * 0.25, 50, W / 2, H / 2, H * 0.8); g.addColorStop(0, th[1]); g.addColorStop(1, th[2]);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 160; i++) { x.fillStyle = `rgba(255,220,120,${Math.random() * 0.6})`; x.beginPath(); x.arc(Math.random() * W, Math.random() * H, Math.random() * 2.6, 0, 7); x.fill(); }
  x.font = '64px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  ['🌸', '✨', '🎈', '💛', '🌷', '⭐'].forEach((em, i) => x.fillText(em, i % 2 ? W - 120 : 120, 140 + i * 190));
  x.strokeStyle = th[3]; x.lineWidth = 6; x.beginPath(); x.roundRect ? x.roundRect(48, 48, W - 96, H - 96, 48) : x.rect(48, 48, W - 96, H - 96); x.stroke();
  let y = 330;
  if (o.photo) {
    const r = 210, cx = W / 2, cy = 320, s = Math.min(o.photo.width, o.photo.height);
    x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.clip();
    x.drawImage(o.photo, (o.photo.width - s) / 2, (o.photo.height - s) / 2, s, s, cx - r, cy - r, r * 2, r * 2); x.restore();
    x.lineWidth = 12; x.strokeStyle = th[3]; x.beginPath(); x.arc(cx, cy, r + 6, 0, Math.PI * 2); x.stroke();
    y = 330;
  } else { x.font = '230px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.fillText(o.icon, W / 2, 320); }
  const gold = x.createLinearGradient(0, 560, 0, 700); gold.addColorStop(0, '#fff6c2'); gold.addColorStop(0.5, th[3]); gold.addColorStop(1, '#e0951a');
  x.fillStyle = gold; x.shadowColor = 'rgba(255,210,63,.55)'; x.shadowBlur = 30; x.font = '900 104px Nunito, Arial, sans-serif';
  wrapLines(x, o.title, W - 200).slice(0, 2).forEach((l, i) => x.fillText(l, W / 2, 640 + i * 112));
  x.shadowBlur = 0; x.fillStyle = th[3]; x.font = '800 48px Nunito, Arial, sans-serif'; x.fillText(o.sub || '', W / 2, 770);
  x.fillStyle = '#ffffff'; x.font = '700 40px Nunito, Arial, sans-serif';
  const tl = wrapLines(x, String(o.text || '').replace(/\s+/g, ' '), W - 230).slice(0, 7);
  tl.forEach((l, i) => x.fillText(l, W / 2, 860 + i * 54));
  if (o.from) { x.fillStyle = th[3]; x.font = '800 50px Nunito, Arial, sans-serif'; x.fillText('— ' + o.from, W / 2, Math.min(1210, 900 + tl.length * 54 + 40)); }
  x.fillStyle = 'rgba(255,255,255,.45)'; x.font = '700 30px Nunito, Arial, sans-serif'; x.fillText('NEW DAY ✦', W / 2, H - 92);
  return cv;
}
