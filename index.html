  const txt = S.lang === 'uz' ? t.uz : t.ru;
  S.taleSize = S.taleSize || 22;
  const m = modal(`<div class="ghead"><b>${t.icon} ${esc(loc(t.t))}</b><span></span><button class="btn sm" data-act="close">✕</button></div>`
    + `<div class="btnrow" style="margin-top:0"><button class="btn sm" data-act="tfont" data-id="-2">A−</button><button class="btn sm" data-act="tfont" data-id="2">A+</button><button class="btn sm gold" data-act="tread">🔊 ${T('k_qa_read')}</button></div>`
    + `<div class="taletext" id="taleText" style="font-size:${S.taleSize}px">${txt.split('\n\n').map(p => `<p>${esc(p)}</p>`).join('')}</div>`);
  m.classList.add('game'); m._tale = txt;
};
ACT.tfont = el => { S.taleSize = Math.max(16, Math.min(34, (S.taleSize || 22) + +el.dataset.id)); const t = $('#taleText'); if (t) t.style.fontSize = S.taleSize + 'px'; };
ACT.tread = () => { const m = $('#modal'); if (m && m._tale) speak(m._tale); };

/* ---------- закреплённая панель: часы, дата, погода ---------- */
function clockBar() {
  const now = clock(), w = S.wx && S.wx.now ? WMO(S.wx.now.weather_code) : null;
  if (typeof loadWeather === 'function') loadWeather();
  const [, m, d] = now.date.split('-').map(Number);
  return `<div class="clockbar"><b>${Logic.fmtMin(now.min)}</b><span>${esc(WD[S.lang][Logic.weekday(now.date)].slice(0, 3))}, ${d} ${esc(MN[S.lang][m - 1].slice(0, 3))}</span>`
    + (w ? `<span class="cw">${w[0]} ${Math.round(S.wx.now.temperature_2m)}° <small>${esc(cityOf().name)}</small></span>` : '') + `</div>`;
}

/* ---------- атмосферные эффекты: снег, дождь, новогодний режим ---------- */
const fxAllowed = () => (S.settings || {}).effects !== false && safeGet('fp_fx') !== '0';
const isNewYear = d => { const md = d.slice(5); return md >= '12-15' || md <= '01-10'; };
function fxMode() {
  if (!fxAllowed()) return '';
  const c = S.wx && S.wx.now ? S.wx.now.weather_code : -1;
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95) return 'rain';
  if (isNewYear(clock().date)) return 'snow';
  return '';
}
function applyFx() {
  const mode = S.view === 'home' || S.view === 'admin' ? fxMode() : '';
  let fx = document.getElementById('fx');
  if (fx && fx.dataset.mode === mode) return;
  if (fx) fx.remove();
  if (!mode) return;
  fx = document.createElement('div'); fx.id = 'fx'; fx.dataset.mode = mode; fx.className = 'fx ' + mode;
  for (let i = 0; i < (mode === 'snow' ? 26 : 34); i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (mode === 'snow' ? 7 + Math.random() * 7 : 0.8 + Math.random() * 0.6) + 's';
    s.style.animationDelay = (-Math.random() * 10) + 's';
    if (mode === 'snow') { s.textContent = '❄'; s.style.fontSize = (8 + Math.random() * 10) + 'px'; s.style.opacity = 0.35 + Math.random() * 0.45; }
    fx.appendChild(s);
  }
  document.body.appendChild(fx);
}

/* ---------- экран «Начать день» и приветствие (первый вход и повтор из профиля) ---------- */
const INTRO = [['🌅', 'in1'], ['✅', 'in2'], ['🎁', 'in3'], ['🍽️', 'in4'], ['🍳', 'in5'], ['👨‍👩‍👧', 'in6'], ['✨', 'in7']];
function showStart() {
  if (S.started || window.__skipStart || document.getElementById('startov')) return;
  const seen = safeGet('fp_intro') === '1';
  const ov = document.createElement('div'); ov.id = 'startov'; ov.className = 'startov';
  document.body.appendChild(ov);
  S.introI = seen ? INTRO.length : 0;
  drawStart();
}
function drawStart() {
  const ov = document.getElementById('startov'); if (!ov) return;
  const i = S.introI;
  if (i < INTRO.length) {
    const [ic, k] = INTRO[i];
    ov.innerHTML = `<div class="intro"><div class="dots">${INTRO.map((_, n) => `<i class="${n === i ? 'on' : ''}"></i>`).join('')}</div><div class="iic">${ic}</div><h1>${T(k + '_t')}</h1><p>${T(k)}</p>`
      + `<div class="btnrow" style="justify-content:center"><button class="big gold" data-act="introNext">${i === INTRO.length - 1 ? '▶ ' + T('start_day') : T('k_qa_next') + ' ➡'}</button></div>`
      + `<button class="skip" data-act="introSkip">${T('skip')}</button></div>`;
  } else {
    const n = myTasks(clock().date).length;
    ov.innerHTML = `<div class="intro start"><div class="startcoin">${COINSTACK}</div><h1>${T('app_name')}</h1><p>${esc(fmtDate(clock()))}${n ? ' · ' + T('start_tasks', { n }) : ''}</p>`
      + `<button class="big gold pulse" data-act="startDay">▶ ${T('start_day')}</button></div>`;
  }
}
ACT.introNext = () => { S.introI++; if (S.introI >= INTRO.length) { safeSet('fp_intro', '1'); ACT.startDay(); return; } drawStart(); };
ACT.introSkip = () => { safeSet('fp_intro', '1'); S.introI = INTRO.length; drawStart(); };
ACT.startDay = () => {
  S.started = true; S.startedAt = Date.now();
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* нет поддержки */ }
  Snd.unlock();
  if (S.music && !Snd.on) Snd.startMusic();
  play('coin');
  try { const n = myTasks(clock().date).length; const L0 = S.lang; if (L0 === 'uz' && !hasVoice('uz')) S.lang = 'ru'; const msg = T('voice_hello', { n }); S.lang = L0; if (voiceOn()) speak(msg); else if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) { /* без голоса */ }
  setTimeout(() => { if (typeof voiceTick === 'function') voiceTick(); }, 2500);
  const ov = document.getElementById('startov'); if (ov) { ov.classList.add('bye'); setTimeout(() => ov.remove(), 450); }
};
ACT.replayIntro = () => { S.started = false; safeSet('fp_intro', '0'); const ov = document.getElementById('startov'); if (ov) ov.remove(); showStart(); };
ACT.fxToggle = () => { safeSet('fp_fx', safeGet('fp_fx') === '0' ? '1' : '0'); render(); };

/* ---------- резервная копия (админ) ---------- */
const BK_COLS = ['users', 'whitelist', 'tasks', 'settings', 'logs', 'payouts', 'scores', 'claims', 'recipes', 'shared'];
const RESTORE_COLS = ['whitelist', 'tasks', 'settings', 'logs', 'payouts', 'claims', 'recipes', 'shared'];
ACT.backup = () => guarded(async () => {
  const out = { app: 'NEW DAY', at: new Date().toISOString(), data: {} };
  for (const c of BK_COLS) { try { out.data[c] = await Store.dumpCol(c); } catch (e) { out.data[c] = { error: String(e && e.code || e) }; } }
  downloadFile(JSON.stringify(out, null, 1), `new-day-backup-${clock().date}.json`, 'application/json');
  banner('good', '💾 ' + T('bk_done'), '', 3000);
});
ACT.restore = () => {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      let j = null; try { j = JSON.parse(fr.result); } catch (e) { /* плохой файл */ }
      if (!j || j.app !== 'NEW DAY' || !j.data) { banner('warn', T('bk_bad'), '', 3000); return; }
      ask(T('bk_restore_q', { d: String(j.at || '').slice(0, 10) }), async () => {
        let n = 0;
        for (const c of RESTORE_COLS) for (const d of (Array.isArray(j.data[c]) ? j.data[c] : [])) { const id = d._id; const o = Object.assign({}, d); delete o._id; if (id) { await Store.restoreDoc(c, id, o); n++; } }
        banner('good', '♻️ ' + T('bk_restored', { n }), '', 4000);
      });
    };
    fr.readAsText(f);
  };
  inp.click();
};
function admBackup() {
  const fx = (S.settings || {}).effects !== false;
  return `<div class="card"><h2>✨ ${T('fx_title')}</h2><label class="chk"><input type="checkbox" data-act-change="fxall" ${fx ? 'checked' : ''}> ${T('fx_all')}</label><div class="mut">${T('fx_all_hint')}</div></div>`
    + `<div class="card"><h2>💾 ${T('bk_title')}</h2><div class="mut">${T('bk_hint')}</div><div class="btnrow"><button class="btn gold" data-act="backup">⬇ ${T('bk_download')}</button><button class="btn" data-act="restore">⬆ ${T('bk_restore')}</button></div></div>`;
}
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.actChange === 'fxall') guarded(() => Store.saveSettings(Object.assign({}, S.settings, { effects: e.target.checked })));
});

/* ---------- «Как правильно» к заданию ---------- */
ACT.howto = el => {
  const t = taskById(el.dataset.id), h = howtoFor(t); if (!h) return;
  const steps = (S.lang === 'uz' ? h.uz : h.ru) || h.ru;
  modal(`<h2>${esc(t.icon || 'ℹ️')} ${esc(loc(t.title))}</h2><div class="mut">${T('howto_title')}</div>`
    + `<ol class="howsteps">${steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`
    + `<div class="btnrow">${h.vid ? `<button class="btn gold" data-act="vurl" data-url="${esc(h.vid)}" data-title="${esc(loc(t.title))}">▶ ${T('howto_video')}</button>` : ''}`
    + `<button class="btn" data-act="hsay" data-id="${esc(t.id)}">🔊 ${T('k_qa_read')}</button><button class="btn" data-act="close">${T('close')}</button></div>`);
};
ACT.hsay = el => { const t = taskById(el.dataset.id), h = howtoFor(t); if (h) speak(((S.lang === 'uz' ? h.uz : h.ru) || h.ru).join('. ')); };

/* ---------- голос: время задания, приветствие, советы ---------- */
const voiceOn = () => (S.settings || {}).voice !== false && safeGet('fp_voice') !== '0';
const hasVoice = l => { try { return speechSynthesis.getVoices().some(v => (v.lang || '').toLowerCase().startsWith(l)); } catch (e) { return false; } };
function voiceTick() {
  if (!S.started || S.view === 'login' || !S.me || S.me.status !== 'approved' || !S.tasksLoaded || !S.logsLoaded) return;
  const now = clock(), idx = Logic.logIndex(S.logs);
  let anyActive = false;
  myTasks(now.date).forEach(t => {
    const st = Logic.taskState(t, now.date, now, idx.get(Logic.logId(S.me.uid, now.date, t.id)));
    if (st !== 'active') return;
    anyActive = true;
    const k = `fp_due_${t.id}_${now.date}`, open = Logic.toMin(t.time) - (t.earlyMin ?? 15);
    if (safeGet(k) || now.min - open > 25) return;
    safeSet(k, '1');
    play('taskdue'); if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
    banner('good', `${t.icon || '⏰'} ${loc(t.title)}`, T('due_banner', { t: t.time }), 6000);
    const L0 = S.lang; if (L0 === 'uz' && !hasVoice('uz')) S.lang = 'ru';
    const msg = T('voice_task', { t: loc(t.title) }); S.lang = L0;
    if (voiceOn()) setTimeout(() => speak(msg), 900);
  });
  // совет раз в 40 минут, когда нет срочного задания
  if (!anyActive && voiceOn() && Date.now() - (S.lastTip || S.startedAt || Date.now()) > 40 * 60000) {
    S.lastTip = Date.now();
    const g = KIDS.TOGETHER.filter(x => x.age === 3)[Math.floor(Math.random() * 6)];
    const L0 = S.lang; const tipFor = () => T('tip_play', { g: loc(g.t) });
    banner('good', '💡 ' + tipFor(), T('tip_where'), 6500);
    if (L0 === 'uz' && !hasVoice('uz')) S.lang = 'ru'; const msg = tipFor(); S.lang = L0;
    speak(msg);
  }
}

/* ---------- отклик при каждом нажатии ---------- */
const HAPT = (() => { const l = document.createElement('label'); l.id = 'hapt'; l.setAttribute('aria-hidden', 'true'); l.style.cssText = 'position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none'; l.innerHTML = '<input type="checkbox" switch tabindex="-1">'; return l; })();
window.addEventListener('DOMContentLoaded', () => document.body.appendChild(HAPT));
function haptic() {
  try {
    if (navigator.vibrate) { navigator.vibrate(12); return; }
    if (isIOS()) HAPT.click(); // iOS 18+: переключатель даёт лёгкий тактильный отклик
  } catch (e) { /* нет поддержки */ }
}
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('#hapt')) return;
  if (e.target.closest && e.target.closest('button,a,[data-act],select,label')) haptic();
}, true);

</script>
</body>
