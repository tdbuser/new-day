<title>NEW DAY — Yangi kun — Новый день</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--em1:#0f4a36;--em2:#06241a;--em3:#030d09;--gold:#ffd23f;--gold2:#e0951a;--mint:#2ee88f;--green:#15803d;--red:#b91c1c;--card:rgba(6,36,26,.85);--line:rgba(46,232,143,.32);--mut:#9fc7b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,var(--em1) 0%,var(--em2) 55%,var(--em3) 100%) fixed;color:#fff;font-family:Nunito,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35}
#app{max-width:560px;margin:0 auto;padding:12px 14px 80px}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 10px}
h1{font-size:28px;font-weight:900;color:var(--gold)}
h2{font-size:21px;font-weight:900;color:var(--gold)}
h3{font-size:17px;font-weight:800}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 0 30px rgba(46,232,143,.07)}
.center{text-align:center}
.hide{display:none!important}

/* шапка */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;background:linear-gradient(#06241af2,#06241ad0 80%,transparent)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.whot{min-width:0}.nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.lv{font-size:13px;color:var(--gold);font-weight:800}
.avatar{width:42px;height:42px;border-radius:50%;background:#12614a;border:2px solid var(--gold);object-fit:cover;display:grid;place-items:center;font-weight:900;flex:none}
.coinpill{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;border:2px solid var(--gold);background:rgba(0,0,0,.35);box-shadow:0 0 18px rgba(255,210,63,.35);flex:none}
.coinpill b{font-size:23px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.coinpill b.neg{color:#ff8a80}
.coin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;color:#8a5200;background:radial-gradient(circle at 35% 30%,#fff2a8,#ffd23f 60%,var(--gold2));border:2px solid #b86f0a;box-shadow:inset 0 0 0 3px rgba(184,111,10,.25);flex:none}
.coin.sm{width:20px;height:20px;font-size:12px;border-width:1.5px}
.lvbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin:2px 0 8px}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:6px;transition:width .6s}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
.chipbtn,.bar select{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;font-size:15px}
.bar select{appearance:auto;color:#fff}.bar select option{color:#000}
.chipbtn.on{border-color:var(--gold);color:var(--gold)}

/* большие кнопки */
.big{display:block;width:100%;min-height:68px;border:0;border-radius:20px;color:#fff;font-weight:900;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;margin-top:10px;padding:0 14px;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.big.green{background:var(--green)}.big.red{background:var(--red)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn.gold{background:var(--gold);color:#2a1b00;border-color:var(--gold)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.sm{padding:7px 10px;font-size:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:60px;background:#fff;color:#222;border:0;border-radius:18px;font-weight:900;font-size:20px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.gbtn svg{width:26px;height:26px}

/* задания */
.nowcard{border-color:var(--gold);box-shadow:0 0 34px rgba(255,210,63,.18)}
.nowtag{display:inline-block;background:var(--gold);color:#2a1b00;border-radius:999px;padding:2px 12px;font-weight:900;font-size:13px;margin-bottom:6px}
.task{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin:10px 0}
.task.st-active{border-color:var(--gold);background:rgba(255,210,63,.08)}
.task.st-done{border-color:#2ee88f;background:rgba(46,232,143,.1)}
.task.st-missed,.task.st-failed,.task.st-expired{border-color:#ff5a5a;background:rgba(185,28,28,.14)}
.task.st-locked,.task.st-future{opacity:.62}
.trow{display:flex;align-items:center;gap:12px}
.ticon{font-size:30px;flex:none}
.ttime{font-weight:900;color:var(--gold);font-size:15px}
.ttitle{font-weight:800;font-size:19px}
.tbadge{margin-left:auto;font-weight:900;white-space:nowrap;font-size:16px}
.tbadge.ok{color:var(--mint)}.tbadge.bad{color:#ff8a80}
.pbar{height:12px;border-radius:12px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:12px;transition:width .6s}

/* календарь месяца */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.07)}
.cal .d.g{background:#15803d}.cal .d.y{background:#a16207}.cal .d.r{background:#b91c1c}.cal .d.t{outline:2px solid var(--gold)}
.cal .h{font-size:11px;color:var(--mut);text-align:center}
.prize{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:rgba(255,210,63,.12);border:1px solid var(--gold);margin:8px 0}
.prize .pi{font-size:34px}

/* админка */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs .chipbtn{white-space:nowrap}
.badge{background:#e11d48;border-radius:999px;padding:0 7px;margin-left:5px;font-size:12px;font-weight:900}
.u .urow{display:flex;align-items:center;gap:10px}
.chip{margin-left:auto;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900}
.chip.pending{background:#a16207}.chip.approved{background:var(--green)}.chip.blocked{background:var(--red)}
.u.pending{border-color:var(--gold)}
label.f{display:block;margin:8px 0;font-size:14px;color:var(--mut)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;font-size:16px}
label.f select option{color:#000}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:800}
.chk input{width:22px;height:22px;accent-color:var(--mint)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.tk{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.04)}
details.tk summary{cursor:pointer;font-weight:800}
.relgrid{display:flex;flex-wrap:wrap;gap:6px 14px}

/* всплывающие окна и эффекты */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.modal>div{width:min(94vw,480px);max-height:88vh;overflow:auto;background:#06241a;border:1px solid var(--gold);border-radius:22px;padding:18px}
#ovl{position:fixed;inset:0;z-index:80;pointer-events:none;display:grid;place-items:center}
.banner{pointer-events:auto;width:min(92vw,440px);border-radius:24px;padding:20px;text-align:center;font-weight:900;font-size:22px;animation:pop .35s}
.banner.warn{background:#b91c1c;border:3px solid #fff;box-shadow:0 0 60px #ff1f1f}
.banner.burn{background:#450a0a;border:3px solid #ff5a5a;box-shadow:0 0 80px #ff0000}
.banner.good{background:linear-gradient(#ffd23f,#e0951a);color:#2a1b00;border:3px solid #fff2a8}
.banner small{display:block;font-weight:700;font-size:15px;margin-top:6px}
.redflash{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle,transparent 30%,rgba(255,0,0,.55));animation:flash .9s 3}
.flycoin{position:fixed;z-index:90;pointer-events:none;width:30px;height:30px}
body.shake #app{animation:shake .5s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flash{0%,100%{opacity:0}50%{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.demo{background:#a16207;color:#fff;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:800;text-align:center;margin-bottom:8px}
/* ---- добавлено: нижние вкладки, фото, камера, ранги, звуки ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(6,36,26,.96);border-top:2px solid #e0b43a;z-index:40}
.tabbar button{flex:1;background:transparent;border:0;color:#cfe9dc;font:800 14px Nunito,system-ui,sans-serif;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:20px}
.tabbar button.on{background:#e0b43a;color:#2a1b00}
#app{padding-bottom:92px}
.big.gold{background:linear-gradient(180deg,#ffd23f,#e0951a);color:#2a1b00}
.big.gold{margin-top:8px}
.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.rankbig{font-size:22px;font-weight:900;color:var(--gold);margin-top:6px}
.stat{background:rgba(255,255,255,.06);border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:20px}
.hrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.hrow span:nth-child(2){flex:1}
.hrow b.neg{color:#ff8a80}
#modal video{width:100%;border-radius:12px;background:#000;max-height:60vh}

.fbar{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:8px;margin-top:6px}
.fbar span{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar b{text-align:right;font-size:15px}
.fbar .pbar{margin:0}
.fsub{margin:2px 0 0 80px;font-size:12px}
.fam.lead{border-color:#e0b43a;box-shadow:0 0 0 2px rgba(224,180,58,.45),0 0 24px rgba(224,180,58,.25)}
.fam.me{background:rgba(224,180,58,.06)}
.pbar.mine i{background:linear-gradient(90deg,#e0b43a,#ffd86b)}
.cmp{margin-top:10px}
.tabbar button{font-size:13px}

/* ===== logic.js: время, монеты, штрафы, бонусы, ранги, фото, выплаты (без интерфейса) ===== */
const Logic = (() => {
  const pad = n => String(n).padStart(2, '0');

  // Текущие дата и минуты в нужном часовом поясе
  function tzNow(tz, ms) {
    const o = {};
    new Intl.DateTimeFormat('en-CA', {
      timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date(ms)).forEach(p => { o[p.type] = p.value; });
    return { date: `${o.year}-${o.month}-${o.day}`, min: (+o.hour) * 60 + (+o.minute), ms };
  }
  const toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
  const fmtMin = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  function addDays(date, n) {
    const [y, m, d] = date.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  }
  const weekday = date => { const [y, m, d] = date.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
  const weekStart = date => addDays(date, -((weekday(date) + 6) % 7)); // понедельник
  const monthOf = date => date.slice(0, 7);
  const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
  const lastDayOf = ym => `${ym}-${pad(daysInMonth(ym))}`;
  const prevMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 7); };
  const maxStr = (...a) => a.reduce((x, y) => (x > y ? x : y), '');

  const PHOTO_TTL_MS = 48 * 3600 * 1000;   // фото хранятся двое суток
  const RATE_COINS = 5000;                  // монет в месяц, на которые делится бюджет в USD

  const DEFAULTS = {
    missPenaltyPct: 50,    // штраф за пропуск, % от награды задания
    warnings: 2,           // сколько пропусков за день только предупреждают
    burnPct: 70,           // на следующем пропуске сгорает % дневного лимита
    weeklyGoalPct: 80,     // % выполнения за неделю для подарка
    idealPct: 90,          // % выполнения для «идеальной» недели и месяца
    streakStepPct: 2,      // бонус серии: +2% за каждый идеальный день подряд
    streakMaxPct: 30,      // но не больше +30%
    idealWeekBonus: 10000, // +100 монет за идеальную неделю (в сотых)
    idealMonthBonus: 50000,// +500 монет за идеальный месяц
    budgetUsd: 0,          // месячный бюджет на выплаты, USD (задаёт админ)
    rateCoins: RATE_COINS,
    usdPerCoin: 0,         // считается из бюджета; 0 = курс не задан
    backfillDays: 7,       // сколько дней назад дописывать пропуски
    tz: 'Asia/Tashkent',
    sounds: {},
    prizes: [
      { icon: '🍢', uz: "Restoranda shashlik bilan kechki ovqat", ru: 'Ужин с шашлыками в ресторане', en: 'Barbecue dinner at a restaurant' },
      { icon: '🐟', uz: "Baliq restoranida kechki ovqat", ru: 'Ужин в рыбном ресторане', en: 'Dinner at a fish restaurant' },
      { icon: '🍽️', uz: "Restoranda tushlik", ru: 'Обед в ресторане', en: 'Lunch at a restaurant' },
      { icon: '🍰', uz: "Kafeda shirinlik va qahva", ru: 'Десерты и кофе в кафе', en: 'Desserts and coffee at a café' },
      { icon: '🎬', uz: "Oilaviy kino", ru: 'Семейный поход в кино', en: 'Family movie night' },
      { icon: '🛍️', uz: "Sovg'a tanlash uchun xarid", ru: 'Шопинг: выбрать себе подарок', en: 'Shopping trip to pick a gift' }
    ]
  };
  // Курс считается из бюджета: бюджет ÷ 5000 монет
  const cfg = s => {
    const c = Object.assign({}, DEFAULTS, s || {});
    if (c.budgetUsd > 0) c.usdPerCoin = c.budgetUsd / (c.rateCoins || RATE_COINS);
    return c;
  };

  // Ранги по заработанным монетам (порог в монетах)
  const RANKS = [
    [0, { uz: 'Yangi boshlovchi', ru: 'Новичок', en: 'Beginner' }],
    [500, { uz: 'Olov', ru: 'Огонёк', en: 'Spark' }],
    [1500, { uz: "Oila tayanchi", ru: 'Опора дома', en: 'Home pillar' }],
    [3500, { uz: 'Kun ustasi', ru: 'Мастер дня', en: 'Day master' }],
    [7000, { uz: 'Oila yulduzi', ru: 'Звезда семьи', en: 'Family star' }],
    [12000, { uz: "O'choq qo'riqchisi", ru: 'Хранитель очага', en: 'Hearth keeper' }],
    [20000, { uz: 'Afsona', ru: 'Легенда', en: 'Legend' }]
  ];

  const T0 = (id, time, icon, uz, ru, en, grace) => ({
    id, time, icon, title: { uz, ru, en }, reward: 1000, graceMin: grace, earlyMin: 15,
    relations: ['wife'], uids: [], active: true, since: '', photo: 'opt'
  });
  const DEFAULT_TASKS = [
    T0('wake', '06:00', '⏰', "Uyg'onish", 'Подъём', 'Wake up', 30),
    T0('teeth_am', '07:30', '🪥', "Dilnozaning tishlarini tozalash", 'Почистить зубки Дильнозе', "Brush Dilnoza's teeth", 60),
    T0('breakfast', '08:00', '🍳', 'Nonushta tayyor', 'Завтрак готов', 'Breakfast is ready', 60),

    T0('snack', '16:00', '🍪', 'Yengil tamaddi tayyor', 'Полдник готов', 'Afternoon snack is ready', 60),
    T0('dinner', '18:00', '🍽️', 'Kechki ovqat tayyor', 'Ужин готов', 'Dinner is ready', 60),
    T0('teeth_pm', '21:00', '🪥', "Dilnozaning tishlarini tozalash (kechqurun)", 'Почистить зубки Дильнозе (вечером)', "Brush Dilnoza's teeth (evening)", 60),
    T0('medicine', '21:00', '💊', "Dilnozaga dori (kalsiy) berish", 'Дать Дильнозе препарат (кальций)', 'Give Dilnoza her medicine (calcium)', 60),
    T0('sleep', '22:00', '🌙', 'Uxlash vaqti', 'Отбой', 'Bedtime', 30)
  ];

  // Кому назначено задание в этот день
  function assigned(t, u, date) {
    if (!t || t.active === false) return false;
    const r = t.relations || [];
    const ok = r.includes('*') || (u.relation && r.includes(u.relation)) || (t.uids || []).includes(u.uid);
    if (!ok) return false;
    return !date || date >= maxStr(t.since || '', u.approvedDate || '');
  }
  const sortTasks = ts => ts.slice().sort((a, b) => toMin(a.time) - toMin(b.time) || String(a.id).localeCompare(String(b.id)));
  const logIndex = logs => new Map(logs.map(l => [l.id, l]));
  const logId = (uid, date, taskId) => `${uid}_${date}_${taskId}`;
  const isMiss = l => l && (l.kind === 'missed' || l.kind === 'failed');

  // Состояние задания: locked / active / expired / future или вид записи (done/missed/failed)
  function taskState(t, date, now, log) {
    if (log) return log.kind;
    if (date > now.date) return 'future';
    if (date < now.date) return 'expired';
    const base = toMin(t.time);
    const from = base - (t.earlyMin ?? 15), deadline = base + (t.graceMin ?? 60);
    if (now.min < from) return 'locked';
    if (now.min <= deadline) return 'active';
    return 'expired';
  }

  const photoMode = t => (t && ['off', 'opt', 'req'].includes(t.photo) ? t.photo : 'opt');
  const dayLimit = ts => ts.reduce((s, t) => s + (t.reward || 0), 0);

  // Запись о пропуске: штраф + (при N-м пропуске за день) сгорание части дневного лимита
  function makeMiss(u, t, date, kind, strike, limit, c) {
    const penalty = Math.ceil((t.reward || 0) * c.missPenaltyPct / 100);
    const burn = strike === c.warnings + 1 ? Math.ceil(limit * c.burnPct / 100) : 0;
    return {
      id: logId(u.uid, date, t.id), uid: u.uid, date, taskId: t.id, kind, strike,
      penalty, burn, warn: strike <= c.warnings, delta: -(penalty + burn)
    };

  const missesOn = (logs, date) => logs.filter(l => l.date === date && isMiss(l)).length;

  // Какие пропуски надо дописать (задание просрочено, записи нет)
  function pendingMisses(tasks, logs, u, now, settings) {
    const c = cfg(settings);
    const idx = logIndex(logs);
    const start = maxStr(addDays(now.date, -c.backfillDays), u.approvedDate || '');
    const out = [];
    for (let d = start; d <= now.date && d; d = addDays(d, 1)) {
      const dayTasks = sortTasks(tasks.filter(t => assigned(t, u, d)));
      const limit = dayLimit(dayTasks);
      let count = missesOn(logs, d);
      for (const t of dayTasks) {
        if (idx.has(logId(u.uid, d, t.id))) continue;
        if (taskState(t, d, now, null) !== 'expired') continue;
        count += 1;
        out.push(makeMiss(u, t, d, 'missed', count, limit, c));
      }
    }
    return out;
  }
  // Пропуск, нажатый вручную красной кнопкой
  function failLog(tasks, logs, u, t, now, settings) {
    const c = cfg(settings);
    const dayTasks = tasks.filter(x => assigned(x, u, now.date));
    return makeMiss(u, t, now.date, 'failed', missesOn(logs, now.date) + 1, dayLimit(dayTasks), c);
  }
  // Выполнено. Если задание с фото — запись получает фото и ждёт проверки админом.
  const doneLog = (u, t, now, photo) => {
    const l = { id: logId(u.uid, now.date, t.id), uid: u.uid, date: now.date, taskId: t.id, kind: 'done', delta: t.reward || 0, hasPhoto: !!photo };
    if (photo) { l.photo = photo; l.review = 'pending'; }
    return l;
  };
  const photoExpired = (l, nowMs) => !!(l && l.hasPhoto && l.at && nowMs - l.at > PHOTO_TTL_MS);

  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const balance = logs => sum(logs, l => l.delta || 0);
  const earned = logs => sum(logs.filter(l => l.kind === 'done' || l.kind === 'bonus'), l => l.delta || 0);

  // Ранг по заработку: уровень, название, прогресс до следующего ранга
  function level(earnedCents) {
    const c = earnedCents / 100;
    let i = 0;
    while (i + 1 < RANKS.length && c >= RANKS[i + 1][0]) i++;
    const nxt = RANKS[i + 1] ? RANKS[i + 1][0] : null, cur = RANKS[i][0];
    const pct = nxt === null ? 1 : Math.max(0, Math.min(1, (c - cur) / (nxt - cur)));
    return { level: i + 1, name: RANKS[i][1], pct, toNext: nxt === null ? 0 : Math.max(0, nxt - c) * 100 };
  }

  function dayStats(tasks, logs, u, date, now) {
    const idx = logIndex(logs);
    const ts = tasks.filter(t => assigned(t, u, date));
    let done = 0, missed = 0, open = 0;
    ts.forEach(t => {
      const s = taskState(t, date, now, idx.get(logId(u.uid, date, t.id)));
      if (s === 'done') done++;
      else if (s === 'missed' || s === 'failed' || s === 'expired') missed++;
      else open++;
    });
    const net = sum(logs.filter(l => l.date === date), l => l.delta || 0);
    return { date, total: ts.length, done, missed, open, net };
  }

  // Бонусы: серия идеальных дней, идеальная неделя, идеальный месяц
  const perfectDay = (tasks, logs, u, date, now) => {
    const s = dayStats(tasks, logs, u, date, now);
    return s.total > 0 && s.done === s.total && s.missed === 0;
  };
  function dayBonus(tasks, logs, u, date, now, settings) {
    const c = cfg(settings);
    if (!perfectDay(tasks, logs, u, date, now)) return null;
    let streak = 1, d = addDays(date, -1), guard = 0;
    while (guard++ < 60 && d >= (u.approvedDate || '0000-00-00') && perfectDay(tasks, logs, u, d, now)) { streak++; d = addDays(d, -1); }
    const pct = Math.min(c.streakMaxPct, c.streakStepPct * (streak - 1));
    const limit = dayLimit(sortTasks(tasks.filter(t => assigned(t, u, date))));
    const delta = Math.floor(limit * pct / 100);
    if (delta <= 0) return null;
    return { id: `${u.uid}_bonus_d_${date}`, uid: u.uid, date, taskId: 'bonus', kind: 'bonus', delta, pct, streak };
  }

  const hashStr = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  function weekReport(tasks, logs, u, wStart, now, settings) {
    const c = cfg(settings);
    let done = 0, missed = 0, total = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(wStart, i);
      if (d > now.date) break;
      const s = dayStats(tasks, logs, u, d, now);
      done += s.done; missed += s.missed; total += s.total;
    }
    const counted = done + missed;
    const rate = counted ? done / counted : 0;
    const ended = addDays(wStart, 6) < now.date;
    const won = ended && counted > 0 && rate * 100 >= c.weeklyGoalPct;
    const prize = won && c.prizes.length ? c.prizes[hashStr(wStart) % c.prizes.length] : null;
    return { start: wStart, done, missed, total, rate, ended, won, prize };
  }
  function weekBonus(tasks, logs, u, wStart, now, settings) {
    const c = cfg(settings), r = weekReport(tasks, logs, u, wStart, now, settings);
    if (!r.ended || r.done + r.missed === 0 || r.rate * 100 < c.idealPct) return null;
    return { id: `${u.uid}_bonus_w_${wStart}`, uid: u.uid, date: addDays(wStart, 6), taskId: 'bonus', kind: 'bonus', delta: c.idealWeekBonus };
  }

  function monthReport(tasks, logs, u, ym, now) {
    const days = [];
    for (let i = 1; i <= daysInMonth(ym); i++) {
      const date = `${ym}-${pad(i)}`;
      const s = dayStats(tasks, logs, u, date, now);
      const counted = s.done + s.missed;
      days.push(Object.assign(s, { rate: counted ? s.done / counted : null, future: date > now.date, today: date === now.date }));
    }
    const monthLogs = logs.filter(l => (l.date || '').startsWith(ym));
    const done = sum(days, d => d.done), missed = sum(days, d => d.missed);
    return {
      ym, days, net: balance(monthLogs), done, missed,
      ended: addDays(lastDayOf(ym), 1) <= now.date
    };
  }
  function monthBonus(tasks, logs, u, ym, now, settings) {
    const c = cfg(settings), r = monthReport(tasks, logs, u, ym, now);
    if (!r.ended || r.done + r.missed === 0 || (r.done / (r.done + r.missed)) * 100 < c.idealPct) return null;
    return { id: `${u.uid}_bonus_m_${ym}`, uid: u.uid, date: lastDayOf(ym), taskId: 'bonus', kind: 'bonus', delta: c.idealMonthBonus };
  }

  // Выплату можно запросить только в последний день месяца
  const payoutDay = (now, ym) => now.date === lastDayOf(ym);

  const toUsd = (cents, rate) => (cents / 100) * (rate || 0);
  const money = c => (c / 100).toFixed(2);

  // Серия идеальных дней подряд (сегодня считается, если уже идеальный)
  function streak(tasks, logs, u, now) {
    let d = perfectDay(tasks, logs, u, now.date, now) ? now.date : addDays(now.date, -1), n = 0, guard = 0;
    while (guard++ < 120 && d >= (u.approvedDate || '0000-00-00') && perfectDay(tasks, logs, u, d, now)) { n++; d = addDays(d, -1); }
    return n;
  }
  const pctOf = (done, missed) => (done + missed ? Math.round(done / (done + missed) * 100) : null);

  // Карточка для рейтинга семьи: только цифры, без фото
  function scoreCard(tasks, logs, u, now, settings) {
    const td = dayStats(tasks, logs, u, now.date, now);
    const wr = weekReport(tasks, logs, u, weekStart(now.date), now, settings);
    const mr = monthReport(tasks, logs, u, monthOf(now.date), now);
    const L = level(earned(logs));
    const acts = logs.filter(l => l.kind === 'done' || l.kind === 'missed' || l.kind === 'failed')
      .sort((a, b) => (a.at || 0) - (b.at || 0) || String(a.date).localeCompare(String(b.date)));
    const lastLog = acts[acts.length - 1];
    const t = lastLog ? tasks.find(x => x.id === lastLog.taskId) : null;
    return {
      uid: u.uid, name: u.name || '', photo: u.photo || '', relation: u.relation || '',
      date: now.date,
      todayDone: td.done, todayMissed: td.missed, todayTotal: td.total, todayPct: td.total ? Math.round(td.done / td.total * 100) : null,
      weekPct: pctOf(wr.done, wr.missed), weekDone: wr.done, weekMissed: wr.missed,
      monthPct: pctOf(mr.done, mr.missed), monthDone: mr.done, monthMissed: mr.missed, monthNet: mr.net,
      earned: earned(logs), balance: balance(logs), level: L.level, streak: streak(tasks, logs, u, now),
      last: lastLog ? { id: lastLog.id, kind: lastLog.kind, taskId: lastLog.taskId, title: t ? t.title : null, icon: t ? (t.icon || '') : '', date: lastLog.date } : null
    };
  }

  // Время задания (дата + ЧЧ:ММ в часовом поясе tz) -> UTC в формате iCalendar
  function icsUtc(date, time, tz) {
    const [y, m, d] = date.split('-').map(Number), mins = toMin(time);
    const guess = Date.UTC(y, m - 1, d, Math.floor(mins / 60), mins % 60);
    const loc = tzNow(tz, guess), [ly, lm, ld] = loc.date.split('-').map(Number);
    const off = Date.UTC(ly, lm - 1, ld, Math.floor(loc.min / 60), loc.min % 60) - guess;
    return new Date(guess - off).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  }
  // Файл календаря: каждое задание — ежедневное событие с будильником в его время
  function icsCalendar(tasks, now, tz, titleOf, url) {
    const e = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    const stamp = new Date(now.ms || Date.now()).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

    sortTasks(tasks).forEach(t => {
      const title = ((t.icon || '') + ' ' + titleOf(t)).trim();
      lines.push('BEGIN:VEVENT', `UID:newday-${e(t.id)}@tdbuser.github.io`, `DTSTAMP:${stamp}`,
        `DTSTART:${icsUtc(now.date, t.time, tz)}`, 'DURATION:PT15M', 'RRULE:FREQ=DAILY',
        `SUMMARY:${e(title)}`, `DESCRIPTION:${e('NEW DAY · ' + t.time + (url ? '\n' + url : ''))}`, url ? `URL:${e(url)}` : '',
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${e(title)}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.filter(Boolean).join('\r\n') + '\r\n';
  }

  const api = {
    tzNow, toMin, fmtMin, addDays, weekday, weekStart, monthOf, daysInMonth, lastDayOf, prevMonth, PHOTO_TTL_MS,
    DEFAULTS, cfg, DEFAULT_TASKS, RANKS, photoMode,
    assigned, sortTasks, logIndex, logId, isMiss, taskState, dayLimit, makeMiss, pendingMisses, failLog, doneLog,
    photoExpired, balance, earned, level, dayStats, perfectDay, dayBonus, weekReport, weekBonus, monthReport, monthBonus,
    payoutDay, toUsd, money, hashStr, streak, scoreCard, icsUtc, icsCalendar
  };
  if (typeof module !== 'undefined') module.exports = api;
  return api;
})();


/* ===== sound.js: звуки и музыка. Готовые синтезированные пресеты + своя ссылка на файл ===== */
const Snd = (() => {
  let ctx = null, master = null, musicGain = null, timer = null, step = 0, nextT = 0, musicOn = false;
  let musicPreset = 'chords', musicUrl = '', fileAudio = null, musicAudio = null;
  const chords = [[261.63, 329.63, 392.0], [220.0, 261.63, 329.63], [174.61, 220.0, 261.63], [196.0, 246.94, 293.66]];

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = 0.5; musicGain.connect(master);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }
  function tone(f, t, dur, type, vol, dest, slideTo) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, vol) {
    const n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 3000; g.gain.value = vol;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }

  // Пресеты: звон монет, ошибка, сирена, сгорание, фанфары, колокольчик
  const presets = {
    coin() {
      if (!ensure()) return; const t = ctx.currentTime;
      tone(1318.5, t, 0.10, 'square', 0.10); tone(1760, t + 0.08, 0.45, 'square', 0.10); tone(2637, t + 0.08, 0.40, 'sine', 0.08);
      for (let i = 0; i < 7; i++) tone(1800 + Math.random() * 1800, t + 0.18 + i * 0.055, 0.14, 'triangle', 0.05);
      noise(t + 0.15, 0.25, 0.05);
    },
    bell() {
      if (!ensure()) return; const t = ctx.currentTime;
      tone(1046.5, t, 1.2, 'sine', 0.18); tone(1568, t, 1.0, 'sine', 0.07); tone(2093, t + 0.05, 0.8, 'sine', 0.04);
    },
    wrong() {
      if (!ensure()) return; const t = ctx.currentTime;
      tone(180, t, 0.30, 'sawtooth', 0.22, null, 120); tone(130, t + 0.32, 0.45, 'sawtooth', 0.22, null, 80);
      tone(92, t, 0.75, 'square', 0.12);
    },
    warn() {
      if (!ensure()) return; const t = ctx.currentTime;
      for (let i = 0; i < 6; i++) tone(i % 2 ? 620 : 880, t + i * 0.16, 0.16, 'square', 0.14);
    },
    burn() {
      if (!ensure()) return; const t = ctx.currentTime;
      tone(900, t, 1.0, 'sawtooth', 0.18, null, 70); noise(t, 0.9, 0.12);
    },
    fanfare() {
      if (!ensure()) return; const t = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * 0.11, 0.35, 'triangle', 0.16));
      tone(1046.5, t + 0.6, 0.9, 'sine', 0.14);
    },
    tick() { if (ensure()) tone(1200, ctx.currentTime, 0.05, 'sine', 0.05); },
    off() {}
  };
  const PRESET_NAMES = ['coin', 'bell', 'wrong', 'warn', 'burn', 'fanfare', 'off'];

  // Звук события: если админ задал свою ссылку — играет файл, иначе пресет
  function play(event, sc) {
    const s = sc || {};
    if (s.u) {
      try { if (fileAudio) fileAudio.pause(); fileAudio = new Audio(s.u); fileAudio.play().catch(() => {}); return; } catch (e) { /* пресет ниже */ }
    }
    (presets[s.p] || presets[event] || presets.coin)();
  }
  const coin = () => presets.coin(), wrong = () => presets.wrong(), warn = () => presets.warn(),
    burn = () => presets.burn(), fanfare = () => presets.fanfare(), tick = () => presets.tick();

  // Фоновая музыка: встроенный перебор аккордов или своя ссылка (зацикливается)
  function schedule() {
    while (nextT < ctx.currentTime + 0.5) {
      const bar = Math.floor(step / 8) % chords.length, ch = chords[bar], i = step % 8;
      const f = ch[[0, 1, 2, 1, 0, 1, 2, 1][i]] * (i >= 6 ? 2 : 1);
      tone(f, nextT, 1.1, 'sine', 0.05, musicGain);
      if (i === 0) tone(ch[0] / 2, nextT, 2.4, 'triangle', 0.06, musicGain);
      step++; nextT += 0.42;
    }
  }
  function startMusic() {
    musicOn = true;
    if (musicPreset === 'off') return;
    if (musicUrl) {
      if (!musicAudio) { musicAudio = new Audio(musicUrl); musicAudio.loop = true; }
      musicAudio.play().catch(() => {});
      return;
    }
    if (!ensure() || timer) return;
    nextT = ctx.currentTime + 0.1; schedule(); timer = setInterval(schedule, 200);
  }
  function stopMusic() {
    musicOn = false;
    if (timer) { clearInterval(timer); timer = null; }
    if (musicAudio) musicAudio.pause();
  }
  function setMusic(sc) {
    const s = sc || {};
    const wasOn = musicOn;
    stopMusic();
    musicPreset = s.p || 'chords';
    musicUrl = s.u || '';
    musicAudio = null;
    if (wasOn) startMusic();
  }
  function unlock() { if (ensure() && musicOn && !timer && !musicAudio) startMusic(); }

  return { coin, wrong, warn, burn, fanfare, tick, play, PRESET_NAMES, startMusic, stopMusic, setMusic, unlock, get on() { return musicOn; } };
})();


/* ===== store_demo.js: демо-хранилище в localStorage (без интернета и Firebase) ===== */
const DemoStore = (() => {
  const KEY = 'fp_demo_v1', AUTH = 'fp_demo_auth';
  const fresh = () => ({ users: {}, whitelist: {}, tasks: {}, settings: {}, logs: {}, payouts: {}, scores: {} });
  let st = fresh(), subs = new Set(), authCb = null;
  const load = () => { try { st = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { st = fresh(); } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* переполнено: данные останутся в памяти */ } subs.forEach(f => f()); };
  const watch = fn => { subs.add(fn); fn(); return () => subs.delete(fn); };
  const uidOf = e => 'u_' + e.toLowerCase().replace(/[^a-z0-9]/g, '_');
  const clone = o => JSON.parse(JSON.stringify(o));
  const list = o => Object.values(o).map(clone);

  async function init() { load(); window.addEventListener('storage', () => { load(); subs.forEach(f => f()); }); }
  function curAuth() { try { return JSON.parse(localStorage.getItem(AUTH)); } catch (e) { return null; } }
  function onAuth(cb) { authCb = cb; cb(curAuth()); }
  async function signIn(o) {
    const email = String(o.email || '').trim().toLowerCase();
    if (!email.includes('@')) throw new Error('email');
    localStorage.setItem(AUTH, JSON.stringify({ uid: uidOf(email), email, name: o.name || email.split('@')[0], photo: '' }));
    authCb && authCb(curAuth());
  }
  async function signOut() { localStorage.removeItem(AUTH); authCb && authCb(null); }

  const getUser = async uid => (st.users[uid] ? clone(st.users[uid]) : null);
  const watchUser = (uid, cb) => watch(() => cb(st.users[uid] ? clone(st.users[uid]) : null));
  const createUser = async (uid, d) => { st.users[uid] = clone(d); save(); };
  const updateUser = async (uid, p) => { if (st.users[uid]) Object.assign(st.users[uid], clone(p)); save(); };
  const deleteUser = async uid => { delete st.users[uid]; save(); };
  const watchUsers = cb => watch(() => cb(list(st.users)));

  const getWhitelist = async em => (st.whitelist[em] ? clone(st.whitelist[em]) : null);
  const watchWhitelist = cb => watch(() => cb(Object.entries(st.whitelist).map(([email, v]) => Object.assign({ email }, clone(v)))));
  const addWhitelist = async (em, d) => { st.whitelist[em] = clone(d); save(); };
  const delWhitelist = async em => { delete st.whitelist[em]; save(); };

  const watchTasks = cb => watch(() => cb(list(st.tasks)));
  const saveTask = async t => { st.tasks[t.id] = clone(t); save(); };
  const delTask = async id => { delete st.tasks[id]; save(); };
  const watchSettings = cb => watch(() => cb(clone(st.settings.main || {})));
  const saveSettings = async o => { st.settings.main = clone(o); save(); };

  const watchLogs = (uid, cb) => watch(() => cb(list(st.logs).filter(l => l.uid === uid)));
  const addLog = async l => {
    if (st.logs[l.id] && !String(l.id).startsWith('adj_')) throw new Error('exists');
    st.logs[l.id] = Object.assign(clone(l), { at: Date.now() }); save();
  };
  const delLog = async id => { delete st.logs[id]; save(); };
  const watchPhotos = cb => watch(() => cb(list(st.logs).filter(l => l.hasPhoto)));
  const decidePhoto = async (id, patch) => {
    if (st.logs[id]) { Object.assign(st.logs[id], clone(patch)); st.logs[id].hasPhoto = false; delete st.logs[id].photo; }
    save();
  };
  const updateLog = async (id, patch) => { if (st.logs[id]) Object.assign(st.logs[id], clone(patch)); save(); };

  const watchScores = cb => watch(() => cb(list(st.scores)));
  const saveScore = async (uid, d) => { st.scores[uid] = Object.assign(clone(d), { uid, updatedAt: Date.now() }); save(); };

  const watchPayouts = cb => watch(() => cb(list(st.payouts)));
  const watchMyPayouts = (uid, cb) => watch(() => cb(list(st.payouts).filter(p => p.uid === uid)));
  const addPayout = async p => { st.payouts[p.id] = clone(p); save(); };
  const updatePayout = async (id, p) => { if (st.payouts[id]) Object.assign(st.payouts[id], clone(p)); save(); };

  return { demo: true, init, onAuth, signIn, signOut, getUser, watchUser, createUser, updateUser, deleteUser, watchUsers,
    getWhitelist, watchWhitelist, addWhitelist, delWhitelist, watchTasks, saveTask, delTask, watchSettings, saveSettings,
    watchLogs, addLog, delLog, watchPhotos, decidePhoto, updateLog, watchPayouts, watchMyPayouts, addPayout, updatePayout, watchScores, saveScore };
})();


/* ===== store_firebase.js: реальное хранилище (Firebase Auth + Firestore) ===== */
const FirebaseStore = (() => {
  let A, F, auth, db, onErr = () => {};

async function runAutoMiss() {
  if (S.amBusy || !S.me || S.me.status !== 'approved' || !S.logsLoaded || !S.tasksLoaded) return;
  const now = clock();
  const miss = Logic.pendingMisses(S.tasks, S.logs, S.me, now, S.settings).filter(m => (S.amTried[m.id] || 0) < 3);
  if (!miss.length) return;
  S.amBusy = true;
  const written = [];
  for (const m of miss) {
    S.amTried[m.id] = (S.amTried[m.id] || 0) + 1;
    try { await Store.addLog(m); written.push(m); } catch (e) { console.warn('пропуск не записан', m.id, e && e.message); }
  }
  S.amBusy = false;
  if (written.length) feedbackMiss(written, true);
}

// Бонусы: серия за день, идеальная неделя (прошлая), идеальный месяц (прошлый)
async function runBonuses() {
  if (S.bnBusy || !S.me || S.me.status !== 'approved' || !S.logsLoaded || !S.tasksLoaded) return;
  const now = clock(), idx = Logic.logIndex(S.logs), appr = S.me.approvedDate || '';
  const cands = [];
  const td = Logic.dayBonus(S.tasks, S.logs, S.me, now.date, now, S.settings);
  if (td) cands.push(td);
  for (let k = 1; k <= 2; k++) {
    const ws = Logic.weekStart(Logic.addDays(now.date, -7 * k));
    if (Logic.addDays(ws, 6) < appr) break;
    const wb = Logic.weekBonus(S.tasks, S.logs, S.me, ws, now, S.settings);
    if (wb) cands.push(wb);
  }
  const pm = Logic.prevMonth(Logic.monthOf(now.date));
  if (Logic.lastDayOf(pm) >= appr) {
    const mb = Logic.monthBonus(S.tasks, S.logs, S.me, pm, now, S.settings);
    if (mb) cands.push(mb);
  }
  const fresh = cands.filter(b => !idx.has(b.id));
  if (!fresh.length) return;
  S.bnBusy = true;
  for (const b of fresh) {
    try {
      await Store.addLog(b);
      banner('good', '🎁 ' + kindLabel(b), '+' + M(b.delta) + ' ' + T('coins'), 4200);
      play('fanfare');
    } catch (e) { console.warn('бонус не записан', b.id, e && e.message); }
  }
  S.bnBusy = false;
}

    const dx = b.left + 10 - parseFloat(c.style.left), dy = b.top + 5 - parseFloat(c.style.top);
    const an = c.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(.5)`, opacity: .9 }],
      { duration: 650 + i * 70, delay: i * 55, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'both' });
    an.onfinish = () => c.remove();
  }
}

/* ---------- окна и камера ---------- */
function modal(html) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div>${html}</div>`; document.body.appendChild(m);
  return m;
}
function closeModal() {
  stopCam();
  const m = $('#modal'); if (m) m.remove();
}
function ask(text, onYes) {
  const m = modal(`<h3>${esc(text)}</h3><div class="btnrow"><button class="btn red" data-act="askyes">${T('yes')}</button><button class="btn" data-act="close">${T('no')}</button></div>`);
  m._yes = onYes;
}
function stopCam() {
  if (CAM && CAM.stream) CAM.stream.getTracks().forEach(t => t.stop());
  CAM = null;
}
// Фото только с камеры: видео с камеры телефона, без выбора из галереи
async function openCamera(onShot) {
  stopCam();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fileCamera(onShot); return; }
  modal(`<h3>${T('cam_title')}</h3><video id="cam" autoplay playsinline muted></video><canvas id="shot" style="display:none"></canvas>`
    + `<div id="camErr" class="mut"></div><div class="btnrow"><button class="btn gold" data-act="snap">📷 ${T('snap')}</button><button class="btn" data-act="camcancel">${T('cancel')}</button></div>`);
  CAM = { onShot, stream: null };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    if (!CAM) { stream.getTracks().forEach(t => t.stop()); return; }
    CAM.stream = stream;
    const v = $('#cam'); if (v) { v.srcObject = stream; v.play().catch(() => {}); }
  } catch (e) {
    stopCam(); closeModal();
    banner('warn', T('cam_fail'), '', 3500);
    fileCamera(onShot);
  }
}
function fileCamera(onShot) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => compress(r.result, onShot); r.readAsDataURL(f);
  };
  banner('warn', T('cam_fallback'), '', 3000);
  inp.click();
}
// Сжатие: до 800 px по ширине, JPEG 0.5 (≈ 50–100 КБ)
function compress(src, cb) {
  const img = new Image();
  img.onload = () => {
    const sc2 = Math.min(1, 800 / img.width), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * sc2); cv.height = Math.round(img.height * sc2);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', 0.5));
  };
  img.src = src;
}

function viewToday() {
  const c = cfgS(), now = clock(), me = S.me, idx = Logic.logIndex(S.logs);
  const ts = myTasks(now.date);
  const states = ts.map(t => ({ t, log: idx.get(Logic.logId(me.uid, now.date, t.id)), st: Logic.taskState(t, now.date, now, idx.get(Logic.logId(me.uid, now.date, t.id))) }));
  const ds = Logic.dayStats(S.tasks, S.logs, me, now.date, now);
  const L = Logic.level(Logic.earned(S.logs));
  const bonusToday = S.logs.find(l => l.kind === 'bonus' && l.date === now.date);
  let out = `<div class="card"><div class="mut">${esc(fmtDate(now))} · ${Logic.fmtMin(now.min)}</div>`;
  if (ts.length) out += `<h3>${T('day_progress', { d: ds.done, n: ds.total })}</h3><div class="pbar"><i style="width:${ds.total ? Math.round(ds.done / ds.total * 100) : 0}%"></i></div>`;
  if (bonusToday) out += `<div class="mut" style="color:var(--gold)">🎁 ${esc(kindLabel(bonusToday))} ${sgn(bonusToday.delta)}</div>`;
  out += `<div class="mut">${esc(loc(L.name))} · ${T('to_next', { c: M(L.toNext) + ' ' + T('coins') })}</div>`;
  if (ts.length) out += `<div class="btnrow"><button class="btn sm" data-act="alarms">⏰ ${T('alarms_btn')}</button></div>`;
  out += `</div>`;

  if (!ts.length) return out + `<div class="card center">${T('no_tasks')}</div>`;

  const active = states.find(s => s.st === 'active');
  const next = states.find(s => s.st === 'locked');
  if (active) out += `<div class="mut" style="margin-top:6px"><span class="nowtag">${T('now')}</span></div>`;
  else if (next) out += `<div class="card nowcard"><span class="nowtag">${T('next_task')}</span><div class="ttitle">${esc(next.t.icon || '')} ${esc(next.t.time)} — ${esc(loc(next.t.title))}</div><div class="mut">${T('in_t', { t: fmtDur(Math.max(0, Logic.toMin(next.t.time) - (next.t.earlyMin ?? 15) - now.min)) })}</div></div>`;
  else out += `<div class="card nowcard center"><h3>🎉 ${T('all_done_today')}</h3></div>`;

  out += states.map(({ t, log, st }) => {
    const mode = Logic.photoMode(t);
    const badge = st === 'done' ? (log.review === 'rejected' ? `<span class="tbadge bad">✗ ${T('photo_rejected')}</span>` : `<span class="tbadge ok">✓ ${sgn(log.delta)}</span>`)
      : (st === 'missed' || st === 'failed') ? `<span class="tbadge bad">✗ ${sgn(log.delta)}</span>`
      : st === 'expired' ? `<span class="tbadge bad">${T('st_expired')}</span>`
      : st === 'locked' ? `<span class="tbadge mut">🔒 ${T('opens_at', { t: Logic.fmtMin(Logic.toMin(t.time) - (t.earlyMin ?? 15)) })}</span>`
      : `<span class="tbadge ok">+${M(t.reward)}</span>`;
    const photoNote = st === 'done' && log.review === 'pending' ? `<div class="mut">📷 ${T('photo_pending')}</div>` : '';
    let btns = '';
    if (st === 'active') {
      if (mode === 'req') btns = `<button class="big green" data-act="done" data-id="${esc(t.id)}">${T('photo_req_btn')}</button>`;
      else {
        btns = `<button class="big green" data-act="done" data-id="${esc(t.id)}">${T('done_btn')}</button>`;
        if (mode === 'opt') btns += `<button class="big gold" data-act="photodone" data-id="${esc(t.id)}">${T('photo_opt_btn')}</button>`;
      }
      btns += `<button class="big red" data-act="fail" data-id="${esc(t.id)}">${T('fail_btn')}</button>`;
    }
    return `<div class="task st-${st}"><div class="trow"><span class="ticon">${esc(t.icon || '•')}</span><div><div class="ttime">${esc(t.time)}</div><div class="ttitle">${esc(loc(t.title))}</div></div>${badge}</div>${photoNote}${btns}</div>`;
  }).join('');
  return out;
}

/* ---------- рейтинг семьи ---------- */
const pctTxt = p => (p === null || p === undefined ? '—' : p + '%');
const pctW = p => (p === null || p === undefined ? 0 : Math.max(0, Math.min(100, p)));
function familyRows() {

  return S.scores.filter(x => x && x.uid && (x.todayTotal || x.earned || x.weekDone || x.weekMissed))

    .sort((a, b) => ((b.weekPct ?? -1) - (a.weekPct ?? -1)) || ((b.todayPct ?? -1) - (a.todayPct ?? -1)) || ((b.monthNet || 0) - (a.monthNet || 0)));

    const last = r.last && r.last.title ? `<div class="mut">${T('fam_last')}: ${esc(r.last.icon || '')} ${esc(loc(r.last.title))} · ${r.last.kind === 'done' ? '✅' : '❌'}</div>` : '';

      + bar(T('fam_today'), r.todayPct, r.todayTotal ? T('fam_done_of', { d: r.todayDone || 0, n: r.todayTotal, m: r.todayMissed || 0 }) : T('fam_no_tasks'))
      + bar(T('fam_week'), r.weekPct, T('fam_dm', { d: r.weekDone || 0, m: r.weekMissed || 0 }))
      + bar(T('fam_month'), r.monthPct, T('fam_dm', { d: r.monthDone || 0, m: r.monthMissed || 0 }))

function weekCard(now, c) {
  const me = S.me, ws = Logic.weekStart(now.date);
  const cur = Logic.weekReport(S.tasks, S.logs, me, ws, now, S.settings);
  let won = '';
  for (let k = 1; k <= 6; k++) {
    const start = Logic.addDays(ws, -7 * k);
    if (Logic.addDays(start, 6) < (me.approvedDate || '')) break;
    const r = Logic.weekReport(S.tasks, S.logs, me, start, now, S.settings);
    if (r.won && r.prize) won += `<div class="prize"><span class="pi">${esc(r.prize.icon)}</span><div><b>${T('prize_won')}</b><div>${esc(loc(r.prize))}</div><div class="mut">${esc(start)} · ${T('prize_note')}</div></div></div>`;
  }
  return `<div class="card"><h2>🎁 ${T('prizes_title')}</h2><div class="mut">${T('week_progress', { p: Math.round(cur.rate * 100), g: c.weeklyGoalPct })}</div><div class="pbar"><i style="width:${Math.round(cur.rate * 100)}%"></i></div>${won || `<div class="mut">${T('no_prize_yet')}</div>`}</div>`;
}

function monthCard(now, c) {
  const me = S.me, ym = Logic.monthOf(now.date);
  const mr = Logic.monthReport(S.tasks, S.logs, me, ym, now);
  const lead = (Logic.weekday(`${ym}-01`) + 6) % 7;
  const cells = CALH[S.lang].map(h => `<div class="h">${h}</div>`).join('')
    + '<div></div>'.repeat(lead)
    + mr.days.map((d, i) => {
      const cls = d.future || d.rate === null ? '' : d.rate >= .8 ? 'g' : d.rate >= .5 ? 'y' : 'r';
      return `<div class="d ${cls} ${d.today ? 't' : ''}">${i + 1}</div>`;
    }).join('');
  const rate = c.usdPerCoin;
  const usdNow = Logic.toUsd(Math.max(0, mr.net), rate).toFixed(2);
  const rq = S.myPayouts.find(p => p.month === ym);
  let pay;
  if (rq) pay = `<div class="mut">${rq.status === 'paid' ? '✅ ' + T('payout_paid') : rq.status === 'rejected' ? T('payout_rejected') : '⏳ ' + T('payout_wait')}</div>`;
  else if (!Logic.payoutDay(now, ym)) pay = `<div class="mut">${T('payout_day_only', { d: Logic.lastDayOf(ym) })}</div>`;
  else if (mr.net <= 0) pay = `<div class="mut">${T('payout_none')}</div>`;
  else if (!(rate > 0)) pay = `<div class="mut">${T('rate_not_set')}</div>`;
  else pay = `<div class="btnrow"><button class="btn gold" data-act="payout" data-m="${ym}" data-c="${mr.net}">${T('request_payout')} · $${usdNow}</button></div>`;
  const past = S.myPayouts.filter(p => p.month !== ym).sort((a, b) => String(b.month).localeCompare(String(a.month))).slice(0, 6)
    .map(p => `<div class="prize"><span class="pi">💵</span><div><b>${esc(p.month)}</b>: ${M(p.coins)} ${T('coins')}${p.usd ? ` ≈ $${Number(p.usd).toFixed(2)}` : ''}<div class="mut">${p.status === 'paid' ? '✅ ' + T('payout_paid') : p.status === 'rejected' ? T('payout_rejected') : '⏳ ' + T('payout_wait')}</div></div></div>`).join('');
  return `<div class="card"><h2>📅 ${T('month_plan')}</h2><div class="cal">${cells}</div>`
    + `<div style="margin-top:10px"><b>${T('earned_month')}:</b> <span style="color:var(--gold);font-weight:900">${sgn(mr.net)}</span> ${T('coins')}${rate > 0 ? ` ≈ $${usdNow}` : ''}</div>`
    + `<h3 style="margin-top:12px">💵 ${T('payout_title')}</h3><div class="mut">${T('payout_hint')}</div>${pay}${past}</div>`;
}

ACT.snap = () => {
  const v = $('#cam'), cv = $('#shot');
  if (!v || !v.videoWidth || !CAM) return;
  const k = Math.min(1, 800 / v.videoWidth);
  cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
  cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
  const data = cv.toDataURL('image/jpeg', 0.5);

  stopCam(); closeModal();

};

async function completeTask(t, now, photo, el) {
  const idx = Logic.logIndex(S.logs);
  if (Logic.taskState(t, now.date, now, idx.get(Logic.logId(S.me.uid, now.date, t.id))) !== 'active') return;
  if (Logic.photoMode(t) === 'req' && !photo) { banner('warn', T('photo_req_note'), '', 3000); return; }
  document.querySelectorAll('.big').forEach(b => { b.disabled = true; });
  flyCoin(el);

  await Store.addLog(Logic.doneLog(S.me, t, now, photo));
}

  if (Logic.photoMode(t) === 'req') { openCamera(p => guarded(() => completeTask(t, clock(), p, null))); return; }
  await completeTask(t, now, null, el);
});

  ask(T('confirm_fail', { c: '−' + M(-m.delta) }), async () => {
    const idx = Logic.logIndex(S.logs);
    if (Logic.taskState(t, now.date, now, idx.get(m.id)) === 'done') return;
    await Store.addLog(m); feedbackMiss([m], false);

};

ACT.alarms = () => {
  const now = clock(), ts = myTasks(now.date);
  if (!ts.length) return;
  const url = location.origin + location.pathname;
  const ics = Logic.icsCalendar(ts, now, tz(), t => loc(t.title), url);
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'new-day-alarms.ics';
  document.body.appendChild(a); a.click();

  modal(`<h3>⏰ ${T('alarms_btn')}</h3><p>${T('alarms_help')}</p><div class="btnrow"><button class="btn" data-act="close">OK</button></div>`);

  const read = k => {
    const p = document.querySelector(`[data-snd="${k}"][data-part="p"]`), u = document.querySelector(`[data-snd="${k}"][data-part="u"]`);
    return { p: p ? p.value : undefined, u: u ? u.value.trim() : '' };
  };
  EV_SOUNDS.forEach(([k]) => { sounds[k] = read(k); });
  sounds.music = read('music');
  await Store.saveSettings(Object.assign({}, S.settings, { sounds }));
  const ok = $('#sndOk'); if (ok) ok.textContent = '✓ ' + T('saved_ok');
});
ACT.paid = el => guarded(async () => {
  const p = S.payouts.find(x => x.id === el.dataset.id); if (!p) return;
  await Store.addLog({ id: `adj_pay_${p.id}`, uid: p.uid, date: clock().date, taskId: 'payout', kind: 'payout', delta: -Math.abs(p.coins), note: p.month });
  await Store.updatePayout(p.id, { status: 'paid' });
});
ACT.rejpay = el => guarded(() => Store.updatePayout(el.dataset.id, { status: 'rejected' }));

/* ---------- события ---------- */
document.addEventListener('click', e => {
  Snd.unlock();
  if (S.music && !Snd.on) Snd.startMusic();
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.actChange === 'lang') {
    S.lang = t.value; safeSet('fp_lang', S.lang);
    if (S.me) Store.updateUser(S.me.uid, { lang: S.lang }).catch(() => {});
    render(); return;
  }
  if (t.dataset.uf) {
    const uid = t.dataset.uid, u = S.users.find(x => x.uid === uid); if (!u) return;
    const val = t.type === 'checkbox' ? t.checked : t.value;
    if (u.status === 'approved') {
      if (t.dataset.uf === 'isAdmin') ask(T('confirm_admin'), () => Store.updateUser(uid, { isAdmin: val }));
      else Store.updateUser(uid, { relation: val }).catch(console.error);
      if (t.dataset.uf === 'isAdmin') setTimeout(render, 0);
    } else { S.sel[uid] = Object.assign(S.sel[uid] || {}, { [t.dataset.uf]: val }); }
  }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (S.dirty && !typing()) render(); }, 50); });

window.addEventListener('DOMContentLoaded', () => {
  const o = document.createElement('div'); o.id = 'ovl'; document.body.appendChild(o);
  boot();
});
window.__app = { S, tick, clock, render, Logic };

</script>
</body>
</html>
